<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的宠物 · 第2步</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #FFF8E1, #FFE0B2);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .pet-card {
    /* 从纯白渐变到浅暖色:原来靠舞台那块米色面板衬托白色宠物,
       面板撤掉后改由卡片本身提供一点色差,纯白的猫才不会「隐身」 */
    background: linear-gradient(180deg, #FFFFFF 0%, #FFFDF8 42%, #FFF6E9 100%);
    position: relative;   /* 小游戏浮层要盖满整张卡片,所以卡片得是个「定位参照物」 */
    border-radius: 24px;
    padding: 22px 20px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 30px rgba(255, 152, 0, 0.15);
    text-align: center;
  }

  /* ---------- 宠物选择条 ---------- */
  .pet-picker {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }
  .pet-chip {
    flex: 1;
    padding: 9px 4px;
    border-radius: 12px;
    border: 2px solid transparent;
    background: #FFF3E0;
    font-family: inherit;
    font-size: 13px;
    color: #6D4C41;
    cursor: pointer;
    transition: all 0.2s;
  }
  .pet-chip:hover { background: #FFE0B2; }
  .pet-chip.active {
    border-color: #FF9800;
    background: #FFE0B2;
    font-weight: 600;
  }

  /* ---------- 宠物舞台:开放舞台,没有框 ---------- */
  .stage-wrap {
    position: relative;   /* 让右上角的 Zzz 能绝对定位到宠物上方 */
  }
  .pet-stage {
    position: relative;
    z-index: 1;              /* 盖在卧室场景之上 */
    height: 196px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    /* 关键:这里原来是 background:#FFFBF2 + border-radius:20px 的浅色面板,
       现在改成完全透明 —— 宠物不再被方框框住,而是站在卧室地板上 */
    background: transparent;
    padding-bottom: 8px;     /* 让脚底落在地板上,而不是贴死舞台底边 */
  }
  /* ---------- 卧室场景 ----------
     注意:这一层必须放在 .pet-stage 外面!
     因为 renderPet() 是用 stageEl.innerHTML = ... 整块替换的,
     装饰如果写在舞台里面,每次换宠物都会被擦掉 */
  .room {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    overflow: hidden;
    pointer-events: none;   /* 场景只负责好看,别挡住点击宠物 */
    z-index: 0;
  }
  /* 墙:占上面 60% */
  .wall {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 60%;
    background: linear-gradient(180deg, #F9EDDB 0%, #F2E1C8 100%);
  }
  /* 地板:占下面 40%,木色 + 竖向木缝 */
  .floor {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 40%;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, rgba(150, 108, 58, 0.10) 100%),
      repeating-linear-gradient(90deg, #E7CEA8 0 39px, #D9BA8C 39px 41px);
    border-top: 2px solid #D3AD7B;   /* 墙脚线 */
  }
  /* 窗户:白窗框 + 淡蓝玻璃 + 十字窗棂 + 一朵云 */
  .win {
    position: absolute;
    left: 28px; top: 26px;
    width: 76px; height: 68px;
    border-radius: 9px;
    background: linear-gradient(180deg, #C3E1F3 0%, #EBF7FD 100%);
    border: 5px solid #FFFCF5;
    box-shadow: 0 0 0 1.5px #DCC49C, 0 3px 7px rgba(160, 120, 70, 0.12);
  }
  .win::before, .win::after {   /* 十字窗棂 */
    content: '';
    position: absolute;
    background: #FFFCF5;
  }
  .win::before { left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; }
  .win::after  { top: 50%; left: 0; right: 0; height: 4px; margin-top: -2px; }
  .win i {   /* 玻璃上飘的一朵云 */
    position: absolute;
    left: 7px; bottom: 9px;
    width: 25px; height: 9px;
    border-radius: 999px;
    background: #FFFFFF;
    opacity: 0.9;
  }
  .win i::before {
    content: '';
    position: absolute;
    left: 5px; top: -5px;
    width: 13px; height: 11px;
    border-radius: 50%;
    background: #FFFFFF;
  }

  /* 墙上的小挂画:画里是太阳和地平线 */
  .pic {
    position: absolute;
    right: 30px; top: 32px;
    width: 58px; height: 48px;
    border-radius: 6px;
    background: #FFFCF5;
    border: 4px solid #EBD8B8;
    box-shadow: 0 3px 7px rgba(160, 120, 70, 0.12);
  }
  .pic::before {   /* 画里的暖色太阳 */
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 21px; height: 21px;
    margin: -13px 0 0 -10px;
    border-radius: 50%;
    background: #F5C06A;
  }
  .pic::after {    /* 画里的地平线 */
    content: '';
    position: absolute;
    left: 7px; right: 7px; bottom: 7px;
    height: 3px;
    border-radius: 2px;
    background: #C7D9B5;
  }

  /* 地板上的睡垫(毛茸茸):宠物平时就站在这上面。
     这里改成 SVG —— 因为「毛边」需要一整圈长短不一的圆球,
     纯 CSS 的 border-radius 只能做出光滑的椭圆,做不出绒毛 */
  .bed {
    position: absolute;
    left: 50%; bottom: 0;
    width: 220px; height: 70px;
    margin-left: -110px;
  }

  /* 右侧地板上的小台灯:梯形灯罩 + 细灯杆 */
  .lamp {
    position: absolute;
    right: 30px; bottom: 30px;
    width: 36px; height: 54px;
  }
  .lamp::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 21px;
    border-radius: 4px 4px 1px 1px;
    background: linear-gradient(180deg, #F8CE8A, #EFB865);
    clip-path: polygon(16% 0, 84% 0, 100% 100%, 0 100%);
  }
  .lamp::after {
    content: '';
    position: absolute;
    left: 50%; top: 21px; bottom: 0;
    width: 3px;
    margin-left: -1.5px;
    border-radius: 2px;
    background: #C8A87E;
  }
  /* 宠物外面再包一层 .pet-hop,专门负责「跑、跳、睡」的整体位移。
     分工:.pet-hop 管整只宠物怎么移动,.pet-svg 管它自己怎么呼吸/颠簸 */
  .pet-hop {
    position: relative;   /* 配合下面的 z-index,让宠物盖在两层光晕之上 */
    z-index: 1;
    line-height: 0;
    transform-origin: center bottom;   /* 压缩、拉伸都以「脚底」为基准,才像站在地上 */
  }
  .pet-svg {
    display: block;
    width: 184px;
    height: 167px;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  /* ---------- 眨眼 ---------- */
  .eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4.5s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    94%           { transform: scaleY(0.1); }
  }

  /* ---------- 摇尾巴 ---------- */
  .tail {
    transform-box: fill-box;
    transform-origin: bottom left;
    animation: wag 1.6s ease-in-out infinite;
  }
  @keyframes wag {
    0%, 100% { transform: rotate(-7deg); }
    50%      { transform: rotate(9deg); }
  }

  /* ---------- 开心表情 ---------- */
  .mouth-happy { opacity: 0; }

  .pet-stage.happy .pet-svg  { animation: bounce 0.6s ease; }
  .pet-stage.happy .eye      { animation: none; transform: scaleY(0.18); }
  .pet-stage.happy .mouth-normal { opacity: 0; }
  .pet-stage.happy .mouth-happy  { opacity: 1; }

  @keyframes bounce {
    0%   { transform: translateY(0); }
    40%  { transform: translateY(-18px); }
    100% { transform: translateY(0); }
  }

  /* ======================================================
     第 5 步:跑、跳、睡
     每个动作就是给 .pet-stage 加一个类名(running / jumping / sleeping),
     CSS 看到类名就自动播放对应的动画。JS 只负责「加类名、过一会儿删掉」。
     ====================================================== */

  /* ---------- ① 跑:外层跑左右,内层颠上下 ---------- */
  .pet-stage.running .pet-hop {
    animation: runTrack 3s linear infinite;
  }
  .pet-stage.running .pet-svg {
    animation: runHop 0.32s ease-in-out infinite;
  }
  .pet-stage.running .tail { animation-duration: 0.45s; }   /* 尾巴甩得更起劲 */

  @keyframes runTrack {
    0%    { transform: translateX(-40px) scaleX(1); }
    49.9% { transform: translateX(40px)  scaleX(1); }    /* 跑到右边 */
    50%   { transform: translateX(40px)  scaleX(-1); }   /* 原地转身(左右镜像) */
    99.9% { transform: translateX(-40px) scaleX(-1); }   /* 跑回左边 */
    100%  { transform: translateX(-40px) scaleX(1); }
  }
  @keyframes runHop {
    0%, 100% { transform: translateY(0)     scale(1, 1); }
    50%      { transform: translateY(-11px) scale(0.97, 1.03); }
  }

  /* ---------- ② 跳:蹲下 → 腾空 → 落地压缩,连跳 3 下 ---------- */
  .pet-stage.jumping .pet-svg { animation: none; }
  .pet-stage.jumping .pet-hop { animation: jump 0.7s ease-in-out 3; }

  @keyframes jump {
    0%   { transform: translateY(0)     scale(1, 1); }
    14%  { transform: translateY(3px)   scale(1.10, 0.90); }   /* 蹲下蓄力 */
    45%  { transform: translateY(-30px) scale(0.94, 1.10); }   /* 腾空拉长 */
    72%  { transform: translateY(3px)   scale(1.10, 0.90); }   /* 落地压扁 */
    100% { transform: translateY(0)     scale(1, 1); }
  }

  /* ---------- ③ 睡:慢慢呼吸,眼睛闭上,右上角冒 Zzz ---------- */
  .pet-stage.sleeping .pet-svg { animation: none; }
  .pet-stage.sleeping .pet-hop { animation: sleepBreath 4s ease-in-out infinite; }
  .pet-stage.sleeping .eye     { animation: none; transform: scaleY(0.12); }
  .pet-stage.sleeping .tail    { animation-duration: 5.5s; }
  .pet-stage.sleeping .mouth-happy { opacity: 0; }
  .pet-stage.sleeping .mouth-normal { opacity: 1; }

  @keyframes sleepBreath {
    0%, 100% { transform: translateY(0)    scale(1, 1); }
    50%      { transform: translateY(-4px) scale(1.02, 1.01); }
  }

  /* Zzz:睡着的信号。写在 .pet-stage 后面,用 ~ 兄弟选择器控制显示 */
  .zzz {
    position: absolute;
    top: 12px;
    right: 28px;
    z-index: 2;             /* 睡觉的 Z 要飘在卧室场景和宠物之上 */
    display: flex;
    align-items: flex-end;
    gap: 2px;
    font-weight: 700;
    color: #A1887F;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;   /* 别挡住点击宠物 */
  }
  .zzz b { font-size: 22px; animation: zfloat 2.4s ease-in-out infinite; }
  .zzz i { font-style: normal; font-size: 15px; animation: zfloat 2.4s ease-in-out 0.35s infinite; }
  .zzz i + i { font-size: 11px; animation-delay: 0.7s; }

  @keyframes zfloat {
    0%   { transform: translateY(8px);   opacity: 0; }
    35%  { transform: translateY(0);     opacity: 1; }
    100% { transform: translateY(-12px); opacity: 0; }
  }
  .pet-stage.sleeping ~ .zzz { opacity: 1; }

  /* ======================================================
     第 17 步:吃东西(两种吃法)
     ------------------------------------------------------
     喂食之后,那样食物会出现在宠物嘴边,一口一口被咬掉。
     做法和跑/跳/睡一模一样 —— 给 .pet-stage 挂一个 'eating' 类,
     剩下全交给 CSS 的 @keyframes;JS 只在到点时把类摘掉。

     ★ 'eating' 再配一个口味类,就是两种完全不同的吃相:
         .eating.like  —— 吃到爱吃的:2.4 秒三口,尾巴甩得飞快,
                          每咬一口掉三粒渣,吃完蹦一下、冒两颗爱心
         .eating.meh   —— 不对口味的:3 秒。食物升到嘴边先「愣着」看一会儿
                          (那 0.75 秒的停顿就是「犹豫」,不用另外画表情),
                          然后只咬两口、每口都小一号,眼睛眯着,
                          尾巴懒得动,一共才掉两粒渣;吃完不蹦,改成甩两下头
     ★ 两段时长分别对应 JS 里的 EAT_LIKE_MS / EAT_MEH_MS,改要一起改。

     碎屑的颜色跟着食物走:七种食物在 JS 的 FOOD_CRUMB 里各配三个色,
     由 startEating() 写成元素上的 --crumb-1/2/3 变量 ——
     吃小鱼干掉的是灰蓝色的渣,吃胡萝卜掉的是橙色的渣。
     ====================================================== */

  /* ---------- 张开的嘴:平时藏着,吃东西时才露出来 ---------- */
  .mouth-eat {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center top;   /* 从上唇往下张开,才像真的张嘴 */
  }

  /* ---------- ① 食物:从脚下升起 → 停在嘴边 → 一口口变小 ---------- */
  /* left / top 由 renderPet() 按每只宠物的嘴高写进去(每只的嘴不在同一高度),
     这里只管大小和动画。负 margin = 让元素以 left/top 那个点为中心 */
  /* left 66% / 44px 这个组合是算过的,不是随手写的:
       .pet-svg 实际显示 184×167(viewBox 是 220×200,所以横向缩 0.836、纵向缩 0.835)。
       三只宠物的右眼换算成像素后,最靠下的是雪球 —— 眼睛底边在 y≈85px。
       食物放在左边 66%、44px 见方,占 y 87~131,正好从眼睛底下擦过去,一点不挡脸;
       它的左边缘又只比嘴唇右边多出一点点,看着像「递到嘴边」而不是「贴在脸上」。 */
  .eat-prop {
    position: absolute;
    left: 66%;
    width: 44px;
    height: 44px;
    margin: -22px 0 0 -22px;
    z-index: 3;
    opacity: 0;
    pointer-events: none;
  }
  .eat-prop svg { display: block; width: 100%; height: 100%; }

  .pet-stage.eating.like .eat-prop { animation: foodEat    2.4s ease-in-out forwards; }
  .pet-stage.eating.meh  .eat-prop { animation: foodEatMeh 3s   ease-in-out forwards; }

  /* 25% / 50% / 75% 是三个「咬」的时刻,和下面 chew、chomp 的节奏对齐 */
  @keyframes foodEat {
    0%   { opacity: 0; transform: translate(0, 34px) scale(0.25) rotate(-20deg); }
    10%  { opacity: 1; transform: translate(0, 0)    scale(1)    rotate(0deg); }
    25%  { transform: translate(0, 0)       scale(1)    rotate(0deg); }   /* 先让你看清是什么 */
    31%  { transform: translate(-3px, -8px) scale(0.82) rotate(-9deg); }  /* 第一口 */
    38%  { transform: translate(0, 0)       scale(0.70) rotate(0deg); }
    50%  { transform: translate(0, 0)       scale(0.70) rotate(0deg); }
    56%  { transform: translate(-3px, -8px) scale(0.52) rotate(8deg); }   /* 第二口 */
    62%  { transform: translate(0, 0)       scale(0.42) rotate(0deg); }
    75%  { transform: translate(0, 0)       scale(0.42) rotate(0deg); }
    81%  { transform: translate(-3px, -8px) scale(0.22) rotate(-7deg); }  /* 第三口 */
    88%  { transform: translate(0, 0)       scale(0.16) rotate(0deg); opacity: 1; }
    100% { opacity: 0; transform: translate(0, -4px) scale(0) rotate(0deg); }
  }

  /* 不对口味的那一套:升到嘴边之后先「愣着」,一直停到 35%(约 1.05 秒)才动 ——
     这段停顿就是「犹豫」,不用额外画表情。然后只咬两口,
     每口都比上面小一号(缩放留得更多、抬起来更轻)。 */
  @keyframes foodEatMeh {
    0%   { opacity: 0; transform: translate(0, 34px) scale(0.25) rotate(-14deg); }
    10%  { opacity: 1; transform: translate(0, 0)    scale(1)    rotate(0deg); }
    35%  { transform: translate(0, 0)       scale(1)    rotate(0deg); }   /* ← 犹豫到这儿 */
    42%  { transform: translate(-2px, -6px) scale(0.84) rotate(-6deg); }  /* 第一口(1.26s) */
    48%  { transform: translate(0, 0)       scale(0.76) rotate(0deg); }
    68%  { transform: translate(0, 0)       scale(0.76) rotate(0deg); }
    72%  { transform: translate(-2px, -6px) scale(0.54) rotate(5deg); }   /* 第二口(2.16s) */
    78%  { transform: translate(0, 0)       scale(0.44) rotate(0deg); }
    92%  { transform: translate(0, 0)       scale(0.16) rotate(0deg); opacity: 1; }
    100% { opacity: 0; transform: translate(0, -3px) scale(0) rotate(0deg); }
  }

  /* ---------- ② 身体:每咬一口就往下压一下(squash & stretch) ---------- */
  .pet-stage.eating .pet-svg { animation: none; }
  /* 0.53s 后开始,每 0.6s 压一次、共 3 次 —— 峰值正好落在 0.74 / 1.34 / 1.94 秒,
     和上面 foodEat 里三个「咬」的时刻对齐 */
  .pet-stage.eating.like .pet-hop { animation: chew 0.6s ease-in-out 0.53s 3; }
  .pet-stage.eating.like .tail    { animation-duration: 0.5s; }   /* 吃得高兴,尾巴甩得快些 */

  /* 不对口:每 0.9 秒压一次、只压 2 次,峰值落在 1.26 / 2.16 秒(两个咬点);
     幅度也比上面小 —— 像不太情愿地嚼两下 */
  .pet-stage.eating.meh .pet-hop { animation: chewMeh 0.9s ease-in-out 0.9s 2; }
  .pet-stage.eating.meh .tail    { animation-duration: 3.4s; }    /* 尾巴懒得动 */

  @keyframes chew {
    0%, 100% { transform: translateY(0)   scale(1, 1); }
    35%      { transform: translateY(4px) scale(1.04, 0.94); }
  }

  @keyframes chewMeh {
    0%, 100% { transform: translateY(0)   scale(1, 1); }
    40%      { transform: translateY(3px) scale(1.03, 0.96); }
  }

  /* 不对口的表情:眼睛眯起来盯着那口饭。20%(0.6 秒)才眯上 —— 先看一眼,才皱脸 */
  .pet-stage.eating.meh .eye { animation: squint 3s ease-in-out forwards; }

  @keyframes squint {
    0%, 8% { transform: scaleY(1); }
    20%    { transform: scaleY(0.42); }
    85%    { transform: scaleY(0.42); }
    100%   { transform: scaleY(1); }
  }

  /* ---------- ③ 嘴:跟着一开一合 ---------- */
  .pet-stage.eating .mouth-normal { opacity: 0; }
  .pet-stage.eating .mouth-happy  { opacity: 0; }
  .pet-stage.eating .mouth-eat { opacity: 1; }
  .pet-stage.eating.like .mouth-eat { animation: chomp 0.6s ease-in-out 0.53s 3; }  /* 和 chew 同一拍子 */
  .pet-stage.eating.meh  .mouth-eat { animation: chompMeh 0.9s ease-in-out 0.9s 2; }

  @keyframes chomp {
    0%, 100% { transform: scaleY(0.5); }
    35%      { transform: scaleY(1.25); }   /* 咬下去的那一刻张到最大 */
  }

  @keyframes chompMeh {
    0%, 100% { transform: scaleY(0.5); }
    40%      { transform: scaleY(1.06); }   /* 嘴也张得小 —— 小口小口地吃 */
  }

  /* ---------- ④ 碎屑:每咬一口,嘴边溅出三粒 ---------- */
  /* 碎屑的起点由 renderPet() 按嘴的高度写进去,这里的 left/top 只是兜底默认值 */
  .crumbs { position: absolute; left: 62%; top: 64%; z-index: 4; pointer-events: none; }
  .crumb {
    position: absolute;
    width: 4px; height: 4px;
    margin: -2px 0 0 -2px;
    border-radius: 50%;
    opacity: 0;
  }
  /* 碎屑的颜色跟着食物走 —— 三个变量由 startEating() 按 FOOD_CRUMB 写上去,
     这里只兜底成「米色渣」。吃小鱼干掉灰蓝色的渣,吃胡萝卜掉橙色的渣 */
  .crumb:nth-child(1) { background: var(--crumb-1, #D8B074); }
  .crumb:nth-child(2) { background: var(--crumb-2, #C9A063); }
  .crumb:nth-child(3) { background: var(--crumb-3, #E6C893); }

  /* 三粒方向各不相同,起飞时间错开一点点,才不会像一起弹出来的。
     0.72s 起 = 第一口咬下去之后的一瞬间 */
  /* 周期必须是 0.6 秒 —— 和咬的节奏一模一样,这样每一粒都正好在咬下去那一刻飞出来。
     关键帧里 60% 就飞完了,剩下 40% 的时间是「隐身等着」,所以周期能拉长而不显得飘。
     (早先写的是 0.5 秒:第一粒对得上,后面两粒会一次比一次早 0.1 秒,越看越别扭) */
  .pet-stage.eating.like .crumb:nth-child(1) { animation: crumbA 0.6s ease-out 0.74s 3; }
  .pet-stage.eating.like .crumb:nth-child(2) { animation: crumbB 0.6s ease-out 0.76s 3; }
  .pet-stage.eating.like .crumb:nth-child(3) { animation: crumbC 0.6s ease-out 0.78s 3; }

  /* 不对口:一共才掉两粒,而且各掉各的 —— 一个咬点配一粒,
     时间分别对上 1.26 / 2.16 秒;末尾的 1 是「只播一次」,
     所以两粒之间隔多久都不会乱(第三粒干脆不演:吃这么点,犯不上掉渣) */
  .pet-stage.eating.meh .crumb:nth-child(1) { animation: crumbA 0.4s ease-out 1.28s 1; }
  .pet-stage.eating.meh .crumb:nth-child(2) { animation: crumbB 0.4s ease-out 2.18s 1; }
  .pet-stage.eating.meh .crumb:nth-child(3) { animation: none; }

  /* 三粒方向各不相同。60% 就飞完并隐身(见上面「周期必须是 0.6 秒」那段),
     9% 时才刚冒头(用 15% 会显得是「突然出现」而不是「溅出来」)。 */
  @keyframes crumbA {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.5); }
    9%   { opacity: 1; }
    60%  { opacity: 0; transform: translate(16px, -18px) scale(0.3); }
    100% { opacity: 0; transform: translate(16px, -18px) scale(0.3); }
  }
  @keyframes crumbB {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.5); }
    9%   { opacity: 1; }
    60%  { opacity: 0; transform: translate(24px, -5px) scale(0.3); }
    100% { opacity: 0; transform: translate(24px, -5px) scale(0.3); }
  }
  @keyframes crumbC {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.5); }
    9%   { opacity: 1; }
    60%  { opacity: 0; transform: translate(14px, 10px) scale(0.3); }
    100% { opacity: 0; transform: translate(14px, 10px) scale(0.3); }
  }

  /* ---------- ⑤ 吃完了:头顶冒两颗爱心 ---------- */
  .hearts {
    position: absolute;
    left: 50%;
    top: 8%;
    margin-left: -32px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;   /* 别挡住点击宠物 */
  }
  .hearts svg { display: block; animation: heartFloat 1.1s ease-in-out infinite; }
  .hearts svg:nth-child(2) { animation-delay: 0.32s; }
  .pet-stage.yum ~ .hearts { opacity: 1; }

  /* 不对口吃完了:不蹦,改成甩两下头(「算了,吃都吃了」),
     爱心也只冒一颗 —— 是高兴,只是没那么高兴 */
  .pet-stage.meh-yum .pet-hop { animation: shakeHead 0.45s ease-in-out 2; }
  .pet-stage.meh-yum ~ .hearts { opacity: 1; }
  .pet-stage.meh-yum ~ .hearts svg:nth-child(2) { opacity: 0; }

  @keyframes shakeHead {
    0%, 100% { transform: rotate(0deg); }
    30%      { transform: rotate(-4deg); }
    70%      { transform: rotate(4deg); }
  }

  @keyframes heartFloat {
    0%   { opacity: 0; transform: translateY(8px)   scale(0.7); }
    30%  { opacity: 1; transform: translateY(0)     scale(1); }
    100% { opacity: 0; transform: translateY(-24px) scale(1.05); }
  }

  /* ---------- 名字与状态 ---------- */
  .pet-name {
    font-size: 23px;
    font-weight: 600;
    color: #5D4037;
    margin: 4px 0 2px;
  }
  .pet-status {
    color: #8D6E63;
    font-size: 13px;
    margin-bottom: 12px;
    min-height: 18px;
  }

  /* ---------- 状态条 ---------- */
  .stat-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
    font-size: 13px;
    color: #6D4C41;
  }
  .stat-bar .label { width: 52px; text-align: left; }
  .stat-bar .bar {
    flex: 1;
    height: 8px;
    background: #FFE0B2;
    border-radius: 4px;
    overflow: hidden;
  }
  .stat-bar .fill {
    height: 100%;
    width: 80%;
    background: linear-gradient(90deg, #FFB74D, #FF9800);
    transition: width 0.3s ease;
  }
  .stat-bar .value { width: 40px; text-align: right; }

  /* ---------- 按钮 ---------- */
  .actions { margin-top: 16px; }

  /* 原来这里还有一套「跑/跳/睡」蓝色虚线按钮的样式(.action-btn.act / .act.on),
     按钮删掉后就成了永远用不到的死代码 —— 顺手清掉,免得以后看晕 */

  .action-btn {
    background: #FF9800;
    color: #fff;
    border: none;
    padding: 10px 22px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    margin: 4px;
    transition: transform 0.1s, background 0.2s;
  }
  .action-btn:hover { background: #F57C00; }
  .action-btn:active { transform: scale(0.95); }
  .action-btn.secondary { background: #FFE0B2; color: #5D4037; }
  .action-btn.secondary:hover { background: #FFCC80; }

  /* ---------- 对话记录区(聊天窗口) ---------- */
  .chat-log {
    margin-top: 14px;
    height: 156px;              /* 固定高度,内容多了在里面滚动 */
    overflow-y: auto;
    padding: 10px;
    background: #FFFBF2;
    border: 1px solid #FFE8CC;
    border-radius: 14px;
    display: flex;
    flex-direction: column;     /* 一条一条从上往下排 */
    gap: 8px;
  }

  /* 单个气泡:宠物在左,你在右 */
  .bubble {
    max-width: 82%;
    padding: 8px 12px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.5;
    word-break: break-word;
    animation: pop 0.25s ease;  /* 冒出来时轻轻上浮一下 */
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .bubble.pet {
    align-self: flex-start;     /* 靠左 */
    background: #FFE0B2;
    color: #5D4037;
    border-bottom-left-radius: 4px;
  }
  .bubble.me {
    align-self: flex-end;       /* 靠右 */
    background: #FF9800;
    color: #FFFFFF;
    border-bottom-right-radius: 4px;
  }

  /* ---------- 输入区 ---------- */
  .input-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .input-row input {
    flex: 1;                    /* 自动撑满剩余宽度 */
    min-width: 0;
    padding: 10px 14px;
    border: 1px solid #FFCC80;
    border-radius: 999px;
    font-size: 14px;
    font-family: inherit;
    color: #5D4037;
    background: #FFFFFF;
    outline: none;
  }
  .input-row input:focus { border-color: #FF9800; }
  .input-row button {
    padding: 10px 18px;
    border: none;
    border-radius: 999px;
    background: #FF9800;
    color: #FFFFFF;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  .input-row button:hover { background: #F57C00; }
  .input-row button:active { transform: scale(0.95); }

  /* ---------- 「试着说」命令提示条 ---------- */
  .cmd-hints {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
  }
  .cmd-hints .cmd-tip { font-size: 12px; color: #B08968; }
  .cmd-chip {
    background: #FFF3E0;
    color: #8D6E63;
    border: 1px dashed #FFCC80;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .cmd-chip:hover { background: #FFE0B2; color: #5D4037; }
  .cmd-chip:active { transform: scale(0.95); }

  /* ---------- 今日健康打卡面板 ---------- */
  .panel {
    margin-top: 14px;
    padding: 12px;
    background: #FFFBF2;
    border: 1px solid #FFE8CC;
    border-radius: 14px;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    font-weight: 500;
    color: #5D4037;
    margin-bottom: 4px;
  }
  .panel-sub { font-size: 12px; font-weight: 400; color: #A1887F; }
  .panel-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .panel-label { font-size: 13px; color: #6D4C41; width: 30px; flex: none; }

  .mini-btn {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid #FFCC80;
    border-radius: 10px;
    background: #FFFFFF;
    color: #6D4C41;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .mini-btn:hover { background: #FFF3E0; }
  .mini-btn:active { transform: scale(0.96); }
  .mini-btn.done {
    background: #EAF3DE;
    border-color: #C0DD97;
    color: #3B6D11;
  }
  .mini-btn.ghost { color: #A1887F; border-color: #E6DED4; background: transparent; }

  /* 还没到打卡时段:变灰 + 虚线边,明示「现在点了也没用」 */
  .mini-btn.locked {
    background: transparent;
    border-style: dashed;
    border-color: #E6DED4;
    color: #C4B5AD;
    cursor: not-allowed;
  }
  .mini-btn.locked:hover,
  .mini-btn.locked:active { background: transparent; transform: none; }

  /* 峰流速记录:两个数字输入框。样式和旁边的按钮是同一套,
     不填的时候是灰字提示,记下了就变绿 */
  .panel-row.pef .panel-label { width: 42px; }
  .pef-input {
    flex: 1;
    min-width: 0;
    padding: 7px 6px;
    border: 1px solid #FFCC80;
    border-radius: 10px;
    background: #FFFFFF;
    color: #6D4C41;
    font-size: 12.5px;
    font-family: inherit;
    text-align: center;
  }
  .pef-input::placeholder { color: #C4B5AD; }
  .pef-input:focus { outline: none; border-color: #FF9800; }
  .pef-input:disabled { background: #F7F3ED; border-color: #E6DED4; color: #B9A79C; }
  .pef-input.done {
    background: #EAF3DE;
    border-color: #C0DD97;
    color: #3B6D11;
    font-weight: 600;
  }
  /* 变异率偏高时的提醒(≥20% 在临床上是个常见的警戒线) */
  .pef-warn { color: #D85A30; }

  /* 面板底下那行小字:写清打卡时段 */
  .panel-note {
    margin-top: 9px;
    font-size: 11.5px;
    line-height: 1.55;
    color: #A1887F;
  }
  .panel-note b { font-weight: 600; color: #8D6E63; }
  /* ---------- 小游戏:俄罗斯方块 ----------
     它是一个盖住整张卡片的浮层。默认 display:none,点「玩耍」才变 flex。
     做成浮层而不是新页面,好处是关掉就回到宠物,状态一点都不会丢。 */
  .game-mask {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: linear-gradient(180deg, #FFFDF8, #FFF3E0);
    border-radius: 24px;
    padding: 16px 14px;
    display: none;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
  }
  .game-mask.open { display: flex; }

  .game-top {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .game-title { font-size: 14px; font-weight: 500; color: #5D4037; }
  .game-close {
    border: 1px solid #E6DED4;
    background: transparent;
    color: #A1887F;
    font-family: inherit;
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 9px;
    cursor: pointer;
  }
  .game-close:hover { background: #FFF3E0; }

  .game-hud { width: 100%; display: flex; gap: 8px; margin-bottom: 10px; }
  .hud-item {
    flex: 1;
    background: #FFF6E9;
    border: 1px solid #FFE8CC;
    border-radius: 10px;
    padding: 5px 4px;
  }
  .hud-k { font-size: 11px; color: #B08968; }
  .hud-v { font-size: 15px; font-weight: 500; color: #5D4037; }

  #tetrisCanvas {
    display: block;
    background: #FFFBF2;
    border: 1px solid #FFE8CC;
    border-radius: 10px;
    touch-action: none;      /* 手机上按住拖动不要触发页面滚动 */
  }

  .game-pads {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .pad-btn {
    padding: 13px 0;
    border: 1px solid #FFCC80;
    border-radius: 12px;
    background: #FFFFFF;
    color: #6D4C41;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .pad-btn:hover { background: #FFF3E0; }
  .pad-btn:active { transform: scale(0.94); }
  .pad-btn.wide { grid-column: span 2; font-size: 13px; }
  .pad-btn.pause-on { background: #FFE0B2; border-color: #FF9800; }

  .game-tip { font-size: 12px; color: #B08968; margin-top: 12px; line-height: 1.7; }

  /* ---------- 一局结束后的结算浮层 ---------- */
  .game-over {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: rgba(255, 253, 248, 0.95);
    border-radius: 24px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .game-over.open { display: flex; }
  .go-title  { font-size: 15px; font-weight: 500; color: #5D4037; }
  .go-score  { font-size: 34px; font-weight: 500; color: #FF9800; margin: 2px 0; }
  .go-line   { font-size: 13px; color: #8D6E63; }
  .go-reward {
    font-size: 13px;
    color: #3B6D11;
    background: #EAF3DE;
    border-radius: 10px;
    padding: 8px 14px;
    margin-top: 10px;
    max-width: 100%;
  }
  .go-btns { display: flex; gap: 10px; margin-top: 14px; }
  .go-btns button {
    padding: 10px 18px;
    border-radius: 11px;
    border: 1px solid #FFCC80;
    background: #FFFFFF;
    color: #6D4C41;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .go-btns button.primary { background: #FF9800; border-color: #FF9800; color: #FFFFFF; }
  .go-btns button:active { transform: scale(0.95); }

  /* ---------- 小卖部:点「喂食」进来的那间小店 ----------
     它和小游戏共用同一套浮层外壳(.game-mask),
     所以位置、圆角、滚动方式天生一致,不用再写一遍。 */
  .shop-wallet {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: linear-gradient(90deg, #FFF3E0, #FFFBF2);
    border: 1px solid #FFE0B2;
    border-radius: 12px;
  }
  .shop-wallet .coin     { font-size: 15px; color: #E8890C; }
  .shop-wallet .wallet-k { font-size: 12px; color: #B08968; }
  .shop-wallet .wallet-v { margin-left: auto; font-size: 20px; font-weight: 500; color: #E8890C; }

  /* 每一段的标题,比如「货架」「我的粮仓」 */
  .shop-sec {
    width: 100%;
    font-size: 12px;
    color: #B08968;
    margin: 14px 2px 8px;
  }

  /* 免费口粮:一整条,点一下就喂,不花钱。领过之后变灰 */
  .shop-free {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding: 11px 12px;
    border: 1px dashed #FFCC80;
    border-radius: 12px;
    background: #FFFDF8;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
  }
  .shop-free:hover  { background: #FFF6E9; }
  .shop-free:active { transform: scale(0.98); }
  .shop-free.used   { cursor: default; opacity: 0.5; transform: none; }
  .shop-free .free-ico  { font-size: 18px; }
  .shop-free .free-body { display: flex; flex-direction: column; gap: 2px; }
  .shop-free .free-t    { font-size: 13px; color: #5D4037; }
  .shop-free .free-s    { font-size: 11px; color: #B08968; }

  /* 货架:两列,六种食物 */
  .shop-grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .food-card {
    position: relative;
    background: #FFFFFF;
    border: 1px solid #FFE8CC;
    border-radius: 12px;
    padding: 10px 10px 9px;
  }
  .food-card.liked { border-color: #FFB74D; background: #FFFCF5; }
  /* 「最爱」那一张再亮一档:边框更实,一眼能从两张对口里认出心头好 */
  .food-card.best  { border-color: #FF9800; background: #FFF8EE; }
  .food-ico  { font-size: 20px; line-height: 1.15; }
  .food-name { font-size: 13px; color: #5D4037; margin-top: 2px; }
  .food-eff  { font-size: 11px; color: #B08968; margin-top: 3px; }
  /* 连着吃会腻的提示。用暖橘色而不是红色 —— 这不是出错,是「换个口味吧」 */
  .food-warn { font-size: 10px; color: #C0703A; margin-top: 2px; }
  .food-tag {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 10px;
    color: #3B6D11;
    background: #EAF3DE;
    border-radius: 999px;
    padding: 2px 6px;
  }
  .food-tag.best { color: #FFFFFF; background: #FF9800; }
  .food-buy {
    width: 100%;
    margin-top: 8px;
    padding: 7px 0;
    border: none;
    border-radius: 9px;
    background: #FF9800;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .food-buy:hover  { background: #F57C00; }
  .food-buy:active { transform: scale(0.95); }
  /* 钱不够:按钮变灰且真的按不动,不用等点了才被拒绝 */
  .food-buy:disabled { background: #EDE4DA; color: #A1887F; cursor: not-allowed; transform: none; }

  /* 我的粮仓 */
  .shop-bag { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .bag-item {
    display: flex;
    align-items: center;
    gap: 9px;
    background: #FFFBF2;
    border: 1px solid #FFE8CC;
    border-radius: 11px;
    padding: 8px 10px;
  }
  .bag-item .bag-ico  { font-size: 17px; }
  .bag-item .bag-name { font-size: 13px; color: #5D4037; }
  .bag-item .bag-num  { display: block; font-size: 11px; color: #B08968; margin-top: 1px; }
  .bag-feed {
    margin-left: auto;
    padding: 6px 14px;
    border: none;
    border-radius: 999px;
    background: #FF9800;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .bag-feed:hover  { background: #F57C00; }
  .bag-feed:active { transform: scale(0.95); }
  .bag-empty { font-size: 12px; color: #C0A48C; padding: 4px 2px; }
</style>
</head>
<body>

  <div class="pet-card">

    <!-- 宠物选择条:由 JS 自动生成 -->
    <div class="pet-picker" id="picker"></div>

    <!-- 宠物画布:SVG 会被塞进这里。外面套一层 .stage-wrap 是为了让 Zzz 能定位 -->
    <div class="stage-wrap">
      <!-- 卧室背景:必须放在 .pet-stage 外面,
           否则 renderPet() 每次换宠物都会把 stageEl.innerHTML 整块替换掉,装饰就没了 -->
      <div class="room" aria-hidden="true">
        <div class="wall"></div>
        <div class="floor"></div>
        <div class="win"><i></i></div>
        <div class="pic"></div>

    <div class="pet-name" id="petName">雪球</div>

      <div class="bar"><div class="fill" id="hungerBar"></div></div>
      <span class="value" id="hungerVal">80%</span>
    </div>
    <div class="stat-bar">
      <span class="label">心情</span>
      <div class="bar"><div class="fill" id="happyBar"></div></div>
      <span class="value" id="happyVal">80%</span>
    </div>

    <div class="actions">
      <button class="action-btn" onclick="openShop()">喂食</button>
      <button class="action-btn secondary" onclick="openGame()">玩耍</button>
      <button class="action-btn secondary" onclick="chat()">聊天</button>
    </div>

    <!-- 跑 / 跳 / 睡:不再放按钮了,改成在下面的输入框里打字下命令
         (说「跑一跑」「跳一跳」「睡觉」「醒过来」「停下」) -->

    <!-- 今日健康:吃药打卡 + 每日签到 -->
    <div class="panel">
      <div class="panel-head">
        <span>今日健康</span>
        <span class="panel-sub" id="signInfo">连续签到 0 天</span>
      </div>
      <div class="panel-row">
        <span class="panel-label">吃药</span>
        <button class="mini-btn" id="medMorning" onclick="markMed('morning')">早上 打卡</button>
        <button class="mini-btn" id="medEvening" onclick="markMed('evening')">晚上 打卡</button>
      </div>
      <!-- 打卡时段说明:内容由 renderHealth() 按 MED_TIME 自动生成,改时间只改那一处 -->
      <div class="panel-note" id="medNote"></div>

      <!-- 峰流速记录:哮喘管理里的「血压计」,早上起床后、晚上睡前各吹一次。
           两个框能填不能填,由 renderHealth() 按当前时段决定 -->
      <div class="panel-row pef">
        <span class="panel-label">峰流速</span>
        <input class="pef-input" id="pefMorning" type="number" inputmode="numeric"
               placeholder="早上" onkeydown="if (event.key === 'Enter') savePef()">
        <input class="pef-input" id="pefEvening" type="number" inputmode="numeric"
               placeholder="晚上" onkeydown="if (event.key === 'Enter') savePef()">
        <button class="mini-btn" id="pefSave" onclick="savePef()">记录</button>
      </div>
      <div class="panel-note" id="pefNote"></div>

      <div class="panel-row">
        <button class="mini-btn" id="signBtn" onclick="checkIn()">今日签到</button>
        <button class="mini-btn ghost" onclick="resetSave()">重置存档</button>
      </div>
    </div>

    <!-- 聊天记录:每条对话都会变成一个小气泡塞进来 -->
    <div class="chat-log" id="log"></div>

    <!-- 输入区:打字后按 Enter 或点「发送」 -->
    <div class="input-row">
      <input id="input" type="text" placeholder="和雪球说点什么…"
             onkeydown="if (event.key === 'Enter') send()">
      <button onclick="send()">发送</button>
    </div>

    <!-- 「试着说」:点一下就等于帮你打字+发送(命令提示条由 JS 生成) -->
    <div class="cmd-hints" id="cmdHints"></div>

    <!-- ============ 小游戏浮层:俄罗斯方块 ============
         它盖在整张卡片上,默认藏着(display:none),点「玩耍」才出现。
         这里放了两个空壳:棋盘画布 #tetrisCanvas 和结算层 #gameOver,
         里面的东西全靠 JS 往上画 / 填 -->
    <div class="game-mask" id="gameMask">

      <div class="game-top">
        <span class="game-title" id="gameTitle">陪雪球玩 · 俄罗斯方块</span>
        <button class="game-close" onclick="closeGame()">退出</button>
      </div>

      <div class="game-hud">
        <div class="hud-item"><div class="hud-k">分数</div><div class="hud-v" id="hudScore">0</div></div>
        <div class="hud-item"><div class="hud-k">消行</div><div class="hud-v" id="hudLines">0</div></div>
        <div class="hud-item"><div class="hud-k">等级</div><div class="hud-v" id="hudLevel">1</div></div>
      </div>

      <!-- 宽 240 / 高 480 = 10 列 × 24 像素、20 行 × 24 像素。
           这两个数字会被 JS 按屏幕像素密度重设,这样在高清屏上才不糊 -->
      <canvas id="tetrisCanvas" width="240" height="480"></canvas>

      <!-- 手机上没有键盘,所以给一套按钮。点它们和按键盘走的是同一个函数 -->
      <div class="game-pads">
        <button class="pad-btn" onclick="gameMove(-1)">←</button>
        <button class="pad-btn" onclick="gameRotate()">旋转</button>
        <button class="pad-btn" onclick="gameMove(1)">→</button>
        <button class="pad-btn" onclick="gameSoftDrop()">↓</button>
        <button class="pad-btn wide" onclick="gameHardDrop()">直接落到底</button>
        <button class="pad-btn wide" id="padPause" onclick="gameTogglePause()">暂停</button>
      </div>

      <div class="game-tip">
        键盘也能玩:← → 左右移动 ↑ 旋转 ↓ 下落 空格 直接落底 P 暂停<br>
        分数越高,心情加得越多(封顶 +25),爱心币也赚得越多<br>
        每打一局饱腹 -30(费脑子);饱腹不足 30 会打不动,先喂它一点
      </div>

      <!-- 不想打方块、只想快点陪它一下?走这条捷径,等于原来那个「玩耍」 -->
      <button class="mini-btn" style="margin-top:10px;max-width:240px;" onclick="quickPlay()">
        不想玩方块,直接陪它玩一下(+15 心情 · 饱腹 -20)
      </button>

      <!-- 一局结束才显示。里面四个数字全是 JS 填的 -->
      <div class="game-over" id="gameOver">
        <div class="go-title" id="goTitle">这局结束啦</div>
        <div class="go-score" id="goScore">0</div>
        <div class="go-line"  id="goLine">消了 0 行 · 等级 1</div>
        <div class="go-reward" id="goReward">心情 +0</div>
        <div class="go-btns">
          <button class="primary" onclick="gameRestart()">再玩一局</button>
          <button onclick="closeGame()">回去陪它</button>
        </div>
      </div>

    </div>

    <!-- ============ 小卖部浮层:点「喂食」打开 ============
         从上到下四段:钱包 → 免费口粮 → 货架 → 我的粮仓。
         货架上的卡片和粮仓里的条目全是 JS 按 FOODS 那张表生成的,
         所以想加一种新食物,只要往表里加一行,界面自动就出来了 -->
    <div class="game-mask" id="shopMask">

        <span class="game-title" id="shopTitle">小卖部</span>

      <div class="game-tip" id="shopTip"></div>

    </div>

  </div>

/* 随机挑一句 */
function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/* 生成顶部的宠物选择按钮 */
function buildPicker() {
  pickerEl.innerHTML = Object.keys(PETS).map(function (key) {
    const active = key === currentPet ? ' active' : '';
    return '<button class="pet-chip' + active + '" onclick="switchPet(\'' + key + '\')">'
           + PETS[key].name + '</button>';
  }).join('');
}

/* 把当前宠物的 SVG 画到舞台上。
   外面包一层 .pet-hop,专门负责跑/跳/睡的整体位移,这样两种动画不会互相打架 */
function renderPet() {
  const p  = PETS[currentPet];
  /* 食物停在「嘴」的高度上。三只宠物的嘴不一边高(小白最高、点点最低),
     所以这个位置写在每只宠物的 mouthY 里,不写死。
     +EAT_GAP 是往下挪一点 —— 齐平会挡住眼睛,挪 7px 刚好从眼睛底下过 */
  const my = (p.mouthY || 58) + EAT_GAP;

  stageEl.innerHTML =
      '<div class="pet-hop">'
    +   p.svg
    /* 吃东西时嘴边那口饭。放在 .pet-hop 里面,这样它会跟着宠物一起晃 */
    +   '<div class="eat-prop" id="eatProp" style="top:' + my + '%"></div>'
    /* 咬东西时溅出来的碎屑 */
    +   '<div class="crumbs" id="eatCrumbs" style="left:62%;top:' + my + '%">'
    +     '<i class="crumb"></i><i class="crumb"></i><i class="crumb"></i>'
    +   '</div>'
    + '</div>';

  document.getElementById('petName').innerText = p.name;
  updateUI();
}

/* 切换宠物 */
function switchPet(key) {
  currentPet = key;
  clearAction();          // 换宠物时,把正在跑/跳/睡的动画停掉
  buildPicker();
  renderPet();
  document.getElementById('input').placeholder = '和' + PETS[key].name + '说点什么…';
  showMessage(PETS[key].name + ':' + pick(REPLIES[key].greet));
}

/* 刷新状态条与名字下方的文字 */
function updateUI() {
  /* ★ 先按流逝的时间结算一次,再画界面。
     放在这里是因为所有互动最后都会走到 updateUI ——
     等于每一步都顺手把「这段时间该掉的」结掉,不用到处记得调 */
  settleStatus();

  document.getElementById('hungerBar').style.width = Math.round(hunger) + '%';
  document.getElementById('happyBar').style.width  = Math.round(happy)  + '%';
  /* 显示一律取整:饱腹是 3.33/小时 这样的小数攒出来的,
     不取整就会在界面上看到「66.66666666666667%」 */
  document.getElementById('hungerVal').innerText = Math.round(hunger) + '%';
  document.getElementById('happyVal').innerText  = Math.round(happy)  + '%';

  /* 状态文字:心情 + 正在做的动作 */
  let mood = happy > 70 ? '开心' : happy > 40 ? '平静' : '需要陪伴';
  /* 后面还排着几份就说清楚 —— 连点了三下却只看到一句「正在吃东西」,
     会让人以为只喂进去一份,白点两下 */
  const q = eatQueue.length ? '(还有 ' + eatQueue.length + ' 份)' : '';
  /* 连着吃同一种会打折,这件事得写在脸上 —— 不然你会以为「怎么加得越来越少了」是坏了 */
  const b = eatBoredLevel > 0 ? '(有点腻了)' : '';
  if (stageEl.classList.contains('eating'))   mood = '正在吃东西' + b + q;
  if (stageEl.classList.contains('meh'))      mood = '正在挑食…' + q;   // 不对口味时换个说法
  if (eatResting)                             mood = '歇口气消化一下' + q;   // 两份之间的 4 秒
  if (stageEl.classList.contains('running'))  mood = '正在奔跑';
  if (stageEl.classList.contains('jumping'))  mood = '正在蹦跳';
  if (stageEl.classList.contains('sleeping')) mood = '睡着啦';
  document.getElementById('status').innerText = PETS[currentPet].name + '当前状态:' + mood;

  saveGame();   // 状态一变就存档。放在这里,所有互动都自动带上了「记住」功能
}

/* ============================================================

   ------------------------------------------------------------
   和 RULES 是同一套关键词匹配,区别只有一个:
     RULES    → 匹配上了,宠物「说一句话」
     COMMANDS → 匹配上了,宠物「做一个动作」
   所以这是两张表,走两条路。send() 里先查 COMMANDS,查不到再查 RULES。
   ============================================================ */

/* 【顺序极其重要】从上往下找,第一条命中就停。
   所以「别跑」必须排在「跑起来」前面,否则用户说"别跑了"它反而跑起来 */
const COMMANDS = [
  { act: 'stop',  tags: ['停下', '停下来', '停一停', '别跑', '别跳', '别动', '别闹', '安静'] },
  { act: 'run',   tags: ['跑一跑', '跑起来', '跑一下', '跑两步', '跑两圈', '跑跑',
                         '快跑', '小跑', '奔跑', '跑圈', '去跑'] },
  { act: 'jump',  tags: ['跳一跳', '跳起来', '跳一下', '跳两下', '跳个', '跳高', '跳跳',
                         '蹦一蹦', '蹦起来', '蹦一下', '蹦跶', '蹦蹦'] },
  { act: 'wake',  tags: ['醒醒', '醒过来', '醒一醒', '醒来', '起床', '该起了', '叫醒',
                         '别睡', '起来'] },
  { act: 'sleep', tags: ['睡觉', '睡一会', '睡一觉', '睡一下', '睡个觉', '睡觉觉', '睡吧',
                         '去睡', '快睡', '该睡了', '午睡', '躺下', '休息', '歇一会', '哄睡'] }
];

/* 在你打的字里找「命令」。找到返回动作名(run/jump/sleep/wake/stop),没有返回 null */
function findCommand(text) {
  const msg = text.toLowerCase();
  for (let i = 0; i < COMMANDS.length; i++) {
    const tags = COMMANDS[i].tags;
    for (let j = 0; j < tags.length; j++) {
      if (msg.indexOf(tags[j].toLowerCase()) !== -1) {
        return COMMANDS[i].act;
      }
    }
  }
  return null;
}

/* 你打的字里找关键词,决定宠物回哪一句 */
function findReply(text) {
  const msg = text.toLowerCase();
  for (let i = 0; i < RULES.length; i++) {
    const tags = RULES[i].tags;
    for (let j = 0; j < tags.length; j++) {
      if (msg.indexOf(tags[j].toLowerCase()) !== -1) {
        return pick(RULES[i].reply);
      }
    }
  }
  return null;   // 一个关键词都没匹配上
}

/* 排队等着吃的几口。连喂多份时,一份接一份吃下去。
   每一项长这样:{ foodId: 'fish', liked: true, say: '雪球:这个我最爱吃啦!' }
   ★ 为什么要有这个队列:以前第二次喂食是「掐断重播」——
     第一口刚吃两口就被打断,动画从 0 秒重头演一遍,看着像卡带。
     现在嘴里这一口咬完,自动接下一口,接得严丝合缝 */
let eatQueue  = [];

/* 这会儿是不是正「歇口气」—— 刚咽下一份、还没开始下一份的那几秒。
   这期间 stageEl 上没有 'eating' 类(动画演完了),但排着的饭还在,
   所以凡是要靠类名判断「它是不是还忙着一顿饭」的地方,都得捎上这个旗子:
     · startEating 入队判断(歇着时新喂的也要排队,不能插队)
     · openShop 的「别打断」判断(歇着时开小卖部不能把饭清了)
     · updateUI 的状态文字(显示「歇口气消化一下」) */
let eatResting = false;

/* 这会儿这一口「腻到第几档」(0 没腻 / 1 有点 / 2 很腻)。
   数值上是饱腹和心情打折,文字上是状态栏那句「正在吃东西(有点腻了)」。
   它跟着当前这一口走 —— clearAction 里会清掉,由 startEating 重新设 */
let eatBoredLevel = 0;

/* 「连着吃同一种会腻」的那本账:{ id: 'fish', n: 2, date: '2026-09-17' }
   意思是「今天连着吃了 2 份小鱼干」。
   n 是已吃份数,下一份会算成第 n+1 份,并据此打折。
   ★ 中间吃了别的东西、或者过了午夜,这本账就作废(见 eatStreakNext)。
     要存进存档 —— 不然刷新一下页面,连着吃十份也永远不打折 */
let eatStreak = { id: '', n: 0, date: '' };

/* 停掉当前动作。注意连着计时器一起清掉 ——
   不清的话,上一次跑剩下的定时器会把你新发起的动作提前掐断。

   keepQueue:要不要连「排队等着吃的饭」一起清掉。
     不传(绝大多数地方)= 清掉 —— 因为凡是走到这里的,都是它要去做别的事了:
       你说「跑一跑」、切宠物、打开小游戏……这些时候剩下那几口自然就不吃了。
     传 true 的只有 startEating 自己 —— 它每吃一口都要先清一下场子,
       要是顺手把队列清了,第二口永远等不到,连着喂就只吃得到第一口。 */
function clearAction(keepQueue) {
  stageEl.classList.remove('running', 'jumping', 'sleeping', 'eating',
                           'like', 'meh', 'yum', 'meh-yum');
  /* 上面一行要跟「所有加在 stageEl 上的状态类」保持同步 ——
     漏掉一个,那个动画就会赖在身上不走(比如 meh-yum 不清,下次喂食还带着挑食的甩头) */
  if (actTimer) { clearTimeout(actTimer); actTimer = null; }
  if (eatTimer) { clearTimeout(eatTimer); eatTimer = null; }
  if (yumTimer) { clearTimeout(yumTimer); yumTimer = null; }
  sleepFrom = 0;
  eatResting = false;    // 歇口气也一并收掉 —— 连着那个「4 秒后吃下一份」的定时器(eatTimer)一起
  eatBoredLevel = 0;     // 这一口的腻度也收掉(下一口由 startEating 重新设)
  if (!keepQueue) eatQueue = [];
  /* 注意这里**不清** eatStreak:它记的是「今天连着吃了几份」,
     跟眼前这一口演完没有关系 —— 清了的话连吃三份就永远不打折了 */
  /* 以前这里还要把「睡觉」按钮的文字改回「睡觉」。
     按钮删掉后这几行也必须一起删 —— 这就是删元素时最容易忘的一步:
     回头搜一遍还有没有 JS 在 getElementById 它,不然一调用就报 null 错。
     现在跑/跳/睡只能从聊天框下命令,所以按钮状态同步的代码整体作废了。 */
}

/* 一个动作持续多少毫秒后自己停 */
function autoStop(ms) {
  if (actTimer) clearTimeout(actTimer);
  actTimer = setTimeout(function () {
    clearAction();
    updateUI();          // 让状态文字变回「心情」
  }, ms);
}

/* ① 跑一跑:跑到右边、转身、再跑回来,来回跑 3 秒 */
function doRun() {
  const name = PETS[currentPet].name;
  clearAction();
  stageEl.classList.add('running');
  happy  = Math.min(100, happy  + 4);
  hunger = Math.max(0,   hunger - 3);     // 跑动会消耗体力
  updateUI();
  showMessage(name + ':' + pick(['踏踏踏~ 我跑起来啦!',
                                 '追得上我吗?我跑得可快了',
                                 '跑一跑,肺活量练起来~']));
  autoStop(3200);
}

/* ② 跳一跳:蹲下 → 腾空 → 落地,连跳 3 下(0.7 秒 × 3 = 2.1 秒) */
function doJump() {
  const name = PETS[currentPet].name;
  clearAction();
  stageEl.classList.add('jumping');
  happy = Math.min(100, happy + 4);
  updateUI();
  showMessage(name + ':' + pick(['看我一蹦三尺高!', '跳一跳,长高高~', '嘿咻!再来一下!']));
  autoStop(2200);
}

/* ③ 睡觉:在它睡着的时候再说「睡觉」或说「醒过来」,就是叫醒。睡够 5 秒,心情 +8 */
function doSleep() {
  const name = PETS[currentPet].name;

  /* 已经在睡 → 这次是叫醒 */
  if (stageEl.classList.contains('sleeping')) {
    const slept = Math.round((Date.now() - sleepFrom) / 1000);   // 先算睡了多久
    clearAction();
    if (slept >= 5) {
      happy = Math.min(100, happy + 8);
      showMessage(name + ':呼啊~ 睡得好香!(睡了 ' + slept + ' 秒,心情 +8)');
    } else {
      showMessage(name + ':唔…我才刚躺下呀,再让我睡会儿嘛…');
    }
    updateUI();
    return;
  }

  clearAction();
  stageEl.classList.add('sleeping');
  sleepFrom = Date.now();
  updateUI();
  showMessage(name + ':' + pick(['呼…呼…我眯一小会儿~', '晚安…Zzz…', '有点困了,先睡一下下~']));
}

/* ============================================================
   执行一条命令。
   为什么不让 send() 直接调 doRun()?因为「打字下命令」比「点按钮」多出很多
   现实情况:它可能正在睡、正在跑、本来就没在动。这些都得先判断,再决定做什么。
   这就是「命令」和「动作」的区别 —— 命令要负责看现场。
   ============================================================ */
function doCommand(act) {
  const name = PETS[currentPet].name;
  const sleeping = stageEl.classList.contains('sleeping');
  const running  = stageEl.classList.contains('running');
  const jumping  = stageEl.classList.contains('jumping');

  /* ---- 停:什么都要能停 ---- */
  if (act === 'stop') {
    if (!sleeping && !running && !jumping) {
      showMessage(name + ':我本来就没在动呀~ 要不要我跑一跑?');
      return;
    }
    clearAction();
    updateUI();
    showMessage(name + ':' + (sleeping ? '唔…那我起来啦' : '好,我停下来~'));
    return;
  }

  /* ---- 醒:它已经醒着就告诉你一声,别白叫 ---- */
  if (act === 'wake') {
    if (!sleeping) {
      showMessage(name + ':我一直醒着呢~ 要不要看我跳一跳?');
      return;
    }
    doSleep();          // 它正在睡,这个函数会自动变成「叫醒」
    return;
  }

  /* ---- 睡:已经在睡就别再睡一遍 ---- */
  if (act === 'sleep') {
    if (sleeping) {
      showMessage(name + ':我已经睡着啦…(想叫我起来,就说「醒过来」)');
      return;
    }
    doSleep();
    return;
  }

  /* ---- 跑 / 跳:睡着的时候得先叫醒它,不然叫不动 ---- */
  if (sleeping) {
    showMessage(name + ':呼…呼…(它睡得太沉啦,先对它说「醒过来」吧)');
    return;
  }

  if (act === 'run') {
    if (running) { showMessage(name + ':我已经在跑啦,看我的~'); return; }
    doRun();
  } else if (act === 'jump') {
    if (jumping) { showMessage(name + ':我正在蹦呢!你看高不高~'); return; }
    doJump();
  }
}

/* 让宠物做一个「开心」的表情 + 跳一下。
   被喂食/被摸时也会走到这里 —— 顺手把正在跑/跳/睡的状态停掉,免得动画打架 */
function happyReaction() {
  clearAction();
  stageEl.classList.add('happy');
  setTimeout(function () { stageEl.classList.remove('happy'); }, 900);
}

/* ============================================================
   吃东西:喂食之后的 2.4 秒(不对口味时 3 秒)
   ------------------------------------------------------------
   整段动画都写在 CSS 里(样式表「第 17 步」那一段),这里只做四件事:
     ① 把食物换成对的那一样 —— 喂小鱼干就画小鱼干
     ② 把碎屑染成这种食物的颜色
     ③ 挂上 'eating' 类 + 口味类('like' / 'meh'),CSS 自动开演
     ④ 时间到了摘掉类:爱吃的蹦一下冒两颗爱心,不爱吃的甩甩头冒一颗
   ★ 两个时长必须和 CSS 里 foodEat / foodEatMeh 的时长一致,改一个要改两个。
   ============================================================ */
const EAT_LIKE_MS = 2400;   // 吃到爱吃的:三口,2.4 秒
const EAT_MEH_MS  = 3000;   // 不对口味:先愣 0.75 秒再小口吃两口,共 3 秒
/* 连吃两份中间歇多久。一口气连着塞三份看着像没牙似的,
   歇这一下既像「消化消化」,也让你看清「这是第二份」 */
const EAT_REST_MS = 4000;

/* 食物比「嘴」低多少个百分比高度。
   这个数是算出来的,不是随手填的:三只宠物的眼睛换算成像素后,
   最低的那只(雪球)眼白下沿在 y≈85。食物 44px 见方、以「嘴高 + 9%」为中心时,
   上沿落在 y≈91,离眼睛还有 5.5px 余量 —— 三只里最紧的一处也是安全的 */
const EAT_GAP = 9;

/* foodId 传食物 id('fish' / 'carrot' …);传 'free' 就是免费口粮那一碗。
   liked 传它爱不爱吃这一口(不传就当爱吃 —— 免费口粮走的就是这条路):
     爱吃 → 三口吃得飞快,尾巴甩得起劲,碎屑三粒三粒地掉,吃完蹦一下冒两颗爱心
     不爱 → 先愣着看一眼再小口吃两口,眼睛眯起,尾巴懒得动,碎屑只掉两粒,吃完甩甩头
   say 是它吃这一口时要说的话。连喂好几份时,这句话会跟着各自那一口走 ——
     轮到哪一口才说哪一句,不会出现「才咬第一口就宣布三句都吃完了」
   bored 是这一口「腻到第几档」(见 boredLevelOf)。
     它不改动画 —— 吃相只分「爱吃」和「挑食」两个维度,腻是第三个维度,
     硬塞进动画里会打架。腻体现在状态文字上(「正在吃东西(有点腻了)」)。
   ★ 排队的那几口各自带着自己的 bored:第 3 份排队的时候已经腻了,
     但轮到第 1 份演的时候还不腻 —— 这个值必须跟着那口饭走,不能共用一个 */
function startEating(foodId, liked, say, bored) {
  if (liked === undefined) liked = true;
  if (bored === undefined) bored = 0;

  /* ★ 它嘴里还有东西、或者正在两口之间歇着 → 这一口**排队**,绝不打断。
     这就是「连续喂食」该有的样子:一份吃完歇一下,再吃下一份。
     要是这里直接往下走,就会把第一口掐断、动画从头重播 —— 看着像卡带 */
  if (stageEl.classList.contains('eating') || eatResting) {
    eatQueue.push({ foodId: foodId, liked: liked, say: say, bored: bored });
    updateUI();          // 让状态文字立刻显示「还有 N 份」,不然你会以为没点上
    return;
  }

  clearAction(true);      // 停掉跑/跳/睡(但别动队列 —— 里面是等着吃的下一口)

  const prop = document.getElementById('eatProp');
  if (prop) prop.innerHTML = FOOD_ART[foodId] || FOOD_ART.free;

  /* 碎屑染成这种食物的颜色 —— 三个 CSS 变量写在容器上,
     吃小鱼干掉灰蓝渣、吃胡萝卜掉橙渣。不在表里的(比如 free)就退回米色 */
  const crumbs = document.getElementById('eatCrumbs');
  if (crumbs) {
    const cc = FOOD_CRUMB[foodId] || FOOD_CRUMB.free;
    crumbs.style.setProperty('--crumb-1', cc[0]);
    crumbs.style.setProperty('--crumb-2', cc[1]);
    crumbs.style.setProperty('--crumb-3', cc[2]);
  }

  /* 连着喂两次时,类名一直没变过,浏览器会认为「样式没变化」而不重播动画。
     读一下 offsetWidth 逼它重新算一次布局,动画就会从头再演一遍 ——
     这是重播 CSS 动画的标准小技巧,别删 */
  void stageEl.offsetWidth;

  eatBoredLevel = bored;        // 这一口腻到第几档,状态文字要读它(clearAction 刚清过,所以放在这之后)
  stageEl.classList.add('eating');
  stageEl.classList.add(liked ? 'like' : 'meh');   // 口味类:决定用哪一套吃相
  updateUI();

  /* 它边吃边说。放在挂类名之后,这样气泡和动画是同一拍出现的 */
  if (say) showMessage(say);

  eatTimer = setTimeout(function () {
    eatTimer = null;
    clearAction(true);                // 这一口收干净(类名 + 计时器),队列留着

    /* ★ 队列里还有等着吃的 → 先歇 4 秒再接上。
       爱心和蹦跳留到「整队都吃完」再冒一次 ——
       要是每口都收尾,连吃三口就得 3×(2.4+1.4)=11 秒,太磨叽。
       歇的这 4 秒里它站着喘口气,这会儿再喂的新一份照样排在后面 */
    if (eatQueue.length) {
      eatResting = true;
      updateUI();          // 状态文字换成「歇口气消化一下(还有 N 份)」
      eatTimer = setTimeout(function () {
        eatTimer = null;
        eatResting = false;
        const next = eatQueue.shift();      // 歇够了这才把下一份端上来
        startEating(next.foodId, next.liked, next.say, next.bored);
      }, EAT_REST_MS);
      return;
    }

    if (liked) {
      happyReaction();                // 换上开心表情,蹦一下
      stageEl.classList.add('yum');   // 头顶冒两颗爱心
    } else {
      /* 不爱吃就不蹦 —— 开心得没那么实在,只甩两下头。
         注意这里不能调 happyReaction(),它会先 clearAction() 再挂 'happy',
         换成挑食的表情反而怪 */
      stageEl.classList.add('meh-yum');
    }
    updateUI();
    yumTimer = setTimeout(function () {
      stageEl.classList.remove('yum', 'meh-yum');
      yumTimer = null;
    }, 1400);
  }, liked ? EAT_LIKE_MS : EAT_MEH_MS);
}

/* ---- 三个互动按钮 ----
   ★ 「喂食」按钮现在打开小卖部(openShop);下面这个 feed() 是小卖部里
     那份「免费口粮」:不花钱,但每天只有 1 份 ——
     否则一直点就饱了,货架上的东西也就没人买了 */
function feed() {
  const name = PETS[currentPet].name;
  settleStatus();                // 先结账再判断「饱没饱」,理由同 play()

  if (!canFreeFood()) {
    showMessage(name + ':今天的免费口粮已经领过啦,去货架上买点好吃的吧~');
    return;
  }
  if (hunger >= 95) { showMessage(name + ':肚子已经饱啦,等饿了再领~'); return; }

  freeFoodDate = todayStr();     // 记下「今天领过了」
  hunger = Math.min(100, hunger + 15);
  happy  = Math.min(100, happy  + 3);
  updateUI();
  closeShop();                   // 和粮仓那条路一模一样:先回主界面,再让它当着你面吃
  /* 基础口粮三只都吃,所以第二个参数给 true(走「吃得香」那一套)。
     它不是货架上的东西,没有 like 字段,也就谈不上挑食。
     ★ 它也不参与「连着吃会腻」那本账,而且**不打断**连击:
       每天就一份、三只都吃的口粮,谈不上吃腻;要是它把连击打断了,
       你喂小鱼干 → 领口粮 → 再喂小鱼干,反倒变成「第 1 份」了 */
  startEating('free', true, name + ':' + pick(['吃得津津有味~', '吃饱啦,谢谢你!', '咕噜咕噜,好满足~']));
  renderShop();
}

/* 嗉子不够时的统一回应。两种玩法共用这一句,改文案不会漏掉一处。
   askEl 是「把话说在哪儿」:
     打方块时游戏浮层盖着整个界面,气泡在下头根本看不见,
     所以那种场合要把这句话写进结算面板里 */
function refuseHungry(askEl) {
  const say = PETS[currentPet].name + ':肚子饿啦,先喂我一点再玩好不好~';
  if (askEl) { askEl.innerText = say; return; }
  showMessage(say);
}

/* 开始玩之前先问一句:结完账,嗉子够这次开销吗?
   ★ 必须「先结账、再判断」。
     不这么做就会出现这种事:你 6 小时没来,存档里还写着 25,
     其实早该掉到 5 了 —— 它照样答应跟你玩,「饿着不让玩」等于没生效。
   够 → 返回 true(放心往下玩);不够 → 说一句话并返回 false */
function enoughHungerToPlay(askEl) {
  settleStatus();
  if (hunger >= PLAY_MIN_HUNGER) return true;
  refuseHungry(askEl);   // 饿着还陪它玩,它会越玩越虚 —— 那不是养宠物,是使唤它
  return false;
}

function play() {
  const name = PETS[currentPet].name;

  if (!enoughHungerToPlay()) return;

  hunger = Math.max(0,   hunger - PLAY_HUNGER_COST);
  happy  = Math.min(100, happy  + 15);
  updateUI();
  happyReaction();
  showMessage(name + ':' + pick(['玩得好开心~', '再来一次!', '你的陪伴让我更快乐~']));
}

function chat() {
  const name = PETS[currentPet].name;
  const topics = REPLIES[currentPet];
  const keys = Object.keys(topics);
  const topic = pick(keys);
  showMessage(name + ':' + pick(topics[topic]));
}

/* ---- 发送你输入的那句话 ---- */
function send() {
  const inputEl = document.getElementById('input');
  const text = inputEl.value.trim();

  if (!text) {
    showMessage(PETS[currentPet].name + ':你还没打字呢~ 说点什么吧');
    return;
  }

  pushBubble(text, 'me');     // 先把你的话显示在右边
  inputEl.value = '';         // 清空输入框

  const name = PETS[currentPet].name;

  /* ① 先当成「命令」查一遍。查到了就直接执行动作,后面的聊天规则不再查 ——
     这就是「一次输入只走一条路」,不然它可能又跑又回你一句话,乱套 */
  const act = findCommand(text);
  if (act) {
    setTimeout(function () { doCommand(act); }, 420);
    return;
  }

  /* ② 不是命令,再当成「聊天」去关键词表里查 */
  const reply = findReply(text);

  setTimeout(function () {         // 停顿一下再回,更像真人聊天
    if (reply) {
      happy = Math.min(100, happy + 5);
      updateUI();
      happyReaction();
      showMessage(name + ':' + reply);
    } else {
      showMessage(name + ':这个词我还没学会…你可以命令我「跑一跑」「跳一跳」「睡觉」「醒过来」,'
                     + '也可以问我吃药、峰流速、心情好不好~');
    }
  }, 420);
}

/* ---- 直接点宠物本体,它也会回应你 ---- */
stageEl.addEventListener('click', function () {
  const name = PETS[currentPet].name;
  happy = Math.min(100, happy + 2);
  updateUI();
  happyReaction();
  showMessage(name + ':' + pick(REPLIES[currentPet].touch));
});

/* ============================================================
   第 4 步:让数据「记住」
   ------------------------------------------------------------
   localStorage 是浏览器自带的小仓库,关掉网页、关掉电脑都不会丢。
   规矩只有一条:**只能存字符串**。
   所以对象要先 JSON.stringify 转成文字存进去,读的时候再 JSON.parse 转回来。
   ============================================================ */
const SAVE_KEY = 'myPetSave_v1';

/* 把 7 变成 '07',让日期格式统一成 2026-09-16 这种样子 */
function pad2(n) {
  return n < 10 ? '0' + n : '' + n;
}

/* 今天的日期字符串,用来当作打卡记录的「钥匙」 */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

/* 这个浏览器到底让不让存档?(无痕模式、部分浏览器会禁止) */
function storageOK() {
  try {
    localStorage.setItem('__test__', '1');
    localStorage.removeItem('__test__');
    return true;
  } catch (e) {
    return false;
  }
}

/* 读存档。读到了就返回 true,没有/坏了就返回 false(用默认值) */
function loadGame() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
  if (!raw) return false;

  let data = null;
  try { data = JSON.parse(raw); } catch (e) { return false; }
  if (!data) return false;

  if (PETS[data.pet]) currentPet = data.pet;
  if (typeof data.hunger === 'number') hunger = data.hunger;
  if (typeof data.happy  === 'number') happy  = data.happy;
  medLog   = data.medLog   || {};
  checkins = data.checkins || [];
  lastTime = data.lastTime || Date.now();
  pefLog   = data.pefLog   || {};   // 老存档里没有这一项,给个空对象就行

  /* 小卖部的那四项。老存档里没有这些字段,|| 会给出默认值 ——
     所以这次加功能,不会让之前存过的档读不出来 */
  if (typeof data.coins === 'number') coins = data.coins;
  bag          = data.bag          || {};
  freeFoodDate = data.freeFoodDate || '';
  gameCoin     = data.gameCoin     || { date: '', got: 0 };
  /* 「连着吃同一种」这本账。老存档里没有,给个空账 ——
     空账的 date 是 '',跟今天对不上,所以第一份永远算作「第 1 份」,不打折。
     ★ 这本账必须存档:不存的话刷新一下页面,连吃十份也永远不打折 */
  eatStreak    = data.eatStreak    || { id: '', n: 0, date: '' };

  /* 「漏打卡扣心情」是这次新加的规则,老存档里没有这本账。
     这时候不能从零开始查 —— 那样会把之前好几天全算成漏打卡,一进门心情就归零。
     所以先把已经结束的时段统统标成「判过了」,只从今天往后开始算 */
  if (data.missLog) {
    missLog = data.missLog;
  } else {
    missLog = {};
    seedMissLog();
  }
  return true;
}

/* 写存档。存失败也不报错,页面照常用,只是刷新后不保留 */
function saveGame() {
  /* ★ 这里**不再**刷新 lastTime。
     它现在的含义是「状态结算到哪一刻了」,只有 applyTimePass 能推进它,
     而且只按整分钟推进。以前这里写的是 lastTime = Date.now(),
     等于每次存档都把不足一分钟的零头抹掉 —— 而存档非常频繁,
     结果是「页面一直开着,宠物就永远不饿」,新规则会全被吃掉。 */
  const data = {
    pet: currentPet,
    hunger: hunger,
    happy: happy,
    medLog: medLog,
    checkins: checkins,
    lastTime: lastTime,
    pefLog: pefLog,
    coins: coins,
    bag: bag,
    freeFoodDate: freeFoodDate,
    gameCoin: gameCoin,
    missLog: missLog,
    eatStreak: eatStreak
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
}

/* 你不在的时候,宠物会慢慢饿、慢慢想你 —— 按上面那张表算。
   返回一句「你离开了多久、掉了多少」,变化小到看不出来就返回空字符串。
   nowMs 可以不传(平时就是现在),传了就用传进来的时刻 —— 测试靠它拨表 */
function applyTimePass(nowMs) {
  const now = nowMs || Date.now();
  const minutes = Math.floor((now - lastTime) / 60000);
  if (minutes <= 0) return '';

  const hBefore = hunger, pBefore = happy;
  const hDrop = minutes / 60 * HUNGER_PER_HOUR;    // 饱腹:一天 80,半天 40
  const pDrop = minutes / 60 * HAPPY_PER_HOUR;     // 心情:一小时 2
  hunger = Math.max(0, hunger - hDrop);
  happy  = Math.max(0, happy  - pDrop);

  /* ★ 只把 lastTime 往前推「整分钟」,不足一分钟的零头留着下次接着算。
     要是这里直接写成 = now,那点零头就被抹掉了 ——
     而 updateUI 每隔几秒就会被叫一次,抹来抹去的结果是
     「页面一直开着,宠物就永远不饿」,这条规则等于白写 */
  lastTime += minutes * 60000;

  const hReal = Math.round(hBefore - hunger);
  const pReal = Math.round(pBefore - happy);
  if (hReal <= 0 && pReal <= 0) return '';

  return '你离开了 ' + minutes + ' 分钟,' + PETS[currentPet].name
         + '的饱腹降了 ' + hReal + ' 点、心情降了 ' + pReal + ' 点,快来陪陪它~';
}

/* ---------- 漏打卡的惩罚 ---------- */

/* 把一个日期对象变成 '2026-09-17' 这样的键。
   medLog / pefLog / checkins 都用这个格式,所以统一走这一个函数 */
function dateKeyOf(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

/* 某个「时段」的结束时刻(毫秒时间戳)。
   dateKey 是这一天的记录日 —— 晚上那一顿跨午夜,所以它的结束落在次日。
   时长直接从 MED_TIME 里算,不写死数字:以后改了打卡时段,这里自动跟着改 */
function slotEndMs(dateKey, slot) {
  const p = dateKey.split('-');
  const w = MED_TIME[slot];
  const start = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), w.start, 0, 0, 0);
  return start.getTime() + (w.end - w.start) * 3600000;
}

/* 查「有没有哪个时段已经过去了却没打卡」:漏一个扣 30 心情,早晚都漏正好 60。
   ★ 幂等 —— 每次刷新界面都会查一遍,查过的时段记在 missLog 里,
     没有这本账的话,同一个漏掉的早上会被反复扣分。
   ★ 这里刻意不弹提示:它被 updateUI 每几秒叫一次,弹气泡会刷屏。
     要告诉用户,由启动流程拿返回值去显示。
   返回这一次扣掉的总数 */
function settleMissedMed(nowMs) {
  const now = nowMs || Date.now();
  /* 从「上次结算到的那一刻」往回追,最多追 MISS_LOOKBACK_DAYS 天 ——
     上限是为了「仨月没来」时不至于一次扣穿到底 */
  const from = Math.max(lastTime, now - MISS_LOOKBACK_DAYS * 86400000);

  const d = new Date(from);
  d.setHours(0, 0, 0, 0);

  let lost = 0;
  while (d.getTime() <= now) {
    const key = dateKeyOf(d);
    ['morning', 'evening'].forEach(function (slot) {
      if (slotEndMs(key, slot) > now) return;    // 这个时段还没结束,先不判
      const tag = key + '_' + slot;
      if (missLog[tag]) return;                  // 判过了,不重复扣
      missLog[tag] = true;                       // 先记账,再判定
      const rec = medLog[key];
      if (!rec || !rec[slot]) lost += MISS_MED_PENALTY;   // 这个时段确实没打卡
    });
    d.setDate(d.getDate() + 1);
  }

  if (lost > 0) happy = Math.max(0, happy - lost);
  return lost;
}

/* 第一次用这套规则时,把「过去已经结束的时段」一律标成判过了。不在这一步的话,
   新用户(或老存档)第一次打开就会被算成前几天全在漏打卡,心情一进门就归零 */
function seedMissLog(nowMs) {
  const now = nowMs || Date.now();
  const d = new Date(now - MISS_LOOKBACK_DAYS * 86400000);
  d.setHours(0, 0, 0, 0);
  while (d.getTime() <= now) {
    const key = dateKeyOf(d);
    ['morning', 'evening'].forEach(function (slot) {
      if (slotEndMs(key, slot) <= now) missLog[key + '_' + slot] = true;
    });
    d.setDate(d.getDate() + 1);
  }
}

/* 时间流逝 + 漏打卡,一次结清。
   updateUI 的第一件事就是调它 —— 而所有互动最后都会走到 updateUI,
   等于每一步都顺手把「这段时间该掉的」结掉,不用到处记得手动调。
   返回值是给启动时的提醒用的(平时调用可以不管):
     { away: 离线提醒那句话(没变化就是空串), missed: 这次因漏打卡扣掉的心情 } */
function settleStatus(nowMs) {
  const now = nowMs || Date.now();
  const away   = applyTimePass(now);     // ① 按小时流逝:饱腹、心情
  const missed = settleMissedMed(now);   // ② 漏打卡:每个时段 -30 心情
  return { away: away, missed: missed };
}

/* ---------- 吃药打卡 ---------- */

/* 打卡时段。只有落在窗口里才能打卡,其余时间点击无效。
   数字是 24 小时制的小时;end 超过 24 表示「跨过午夜到第二天」。
   例:evening 写成 13 → 26,就是 13:00 到次日 02:00。
   ★ 想改时段,只改下面这两个数字就行,按钮和提示会自动跟着变。 */
const MED_TIME = {
  morning: { start: 6,  end: 13, label: '06:00–13:00' },   /* 中午 12-13 点也算早上 */
  evening: { start: 13, end: 26, label: '13:00–次日 02:00' }
};

/* 现在几点?带小数(8 点 30 分 = 8.5),方便比较「几点几分」 */
function nowHours(now) {
  const d = now || new Date();
  return d.getHours() + d.getMinutes() / 60;
}

/* 「相对今天这个记录日,现在走到第几个小时了?」
   平时就是 0–24;但凌晨 0–2 点属于「昨天晚上的尾巴」,
   所以看成 24–26 点 —— 这样跨午夜的那一顿也能正确落进窗口。
   ★ 吃药的窗口、峰流速的窗口,判断「现在算几点」都走这一个函数,
     两边永远不会对不上。 */
function dayHours(now) {
  const h = nowHours(now);
  return h < MED_TIME.evening.end - 24 ? h + 24 : h;
}

/* 此刻能不能打这一顿的卡? */
function inMedWindow(slot, now) {
  const w = MED_TIME[slot];
  const h = dayHours(now);
  return h >= w.start && h < w.end;
}

/* 这一顿的峰流速,现在处于什么状态?
     'now'  正当时段内 —— 记录,给爱心币
     'late' 今天的时段已经过去了 —— 允许补记,但不再给币(数据能补,币不能补)
     'wait' 还没到点 —— 先别填                                        */
function pefSlotState(slot, now) {
  const w = MED_TIME[slot];
  const h = dayHours(now);
  if (h >= w.start && h < w.end) return 'now';
  return h < w.start ? 'wait' : 'late';
}

/* 这次打卡算「哪一天」的?
   晚上窗口跨过午夜,所以凌晨 0-2 点补打的,算前一天晚上那一顿,
   这样今天白天、晚上还能正常打今天的卡。 */
function medDateKey() {
  const d = new Date();
  if (nowHours(d) < MED_TIME.evening.end - 24) d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

/* 取出「今天」的吃药记录,没有就新建一条 */
function todayMed() {
  const d = medDateKey();
  if (!medLog[d]) medLog[d] = { morning: false, evening: false };
  return medLog[d];
}

function markMed(slot) {
  const name = PETS[currentPet].name;
  const label = (slot === 'morning' ? '早上' : '晚上');

  /* ① 先看时间:不在时段内,点了也无效 */
  if (!inMedWindow(slot)) {
    showMessage(name + ':' + label + '的药要在 ' + MED_TIME[slot].label
                + ' 之间打卡哦,现在还不能打~');
    return;
  }

  const m = todayMed();

  if (m[slot]) {
    showMessage(name + ':这一顿已经记过啦,不用重复打卡~');
    return;
  }

  m[slot] = true;
  happy = Math.min(100, happy + 5);
  earnCoins(COIN_EARN.med);   // ★ 打卡给爱心币 —— 这是「现实里的坚持」换成「宠物口粮」的那一步
  updateUI();          // updateUI 里会顺手存一次档
  happyReaction();
  renderHealth();
  showMessage(name + ':' + label + '的药记上啦,真棒!我陪你一起坚持~ (爱心币 +'
              + COIN_EARN.med + ')');
}

/* ---------- 每日签到 ---------- */

function checkIn() {
  const name = PETS[currentPet].name;
  const today = todayStr();

  if (checkins.indexOf(today) !== -1) {
    showMessage(name + ':今天已经签到过啦,明天再来哦~');
    return;
  }

  checkins.push(today);
  happy = Math.min(100, happy + 10);
  earnCoins(COIN_EARN.sign);   // 签到比打卡更难得(一天只有一次),所以给得多一点
  updateUI();
  happyReaction();
  renderHealth();
  showMessage(name + ':签到成功!已经连续 ' + streakDays() + ' 天啦,好厉害~ (爱心币 +'
              + COIN_EARN.sign + ')');
}

/* 从今天往前一天天数,连着的算连续天数 */
function streakDays() {
  let count = 0;
  const d = new Date();
  while (true) {
    const key = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    if (checkins.indexOf(key) === -1) break;
    count++;
    d.setDate(d.getDate() - 1);
  }
  return count;
}

/* ---------- 峰流速记录 ----------
   峰流速(PEF)是「用力吹一口气能吹多快」,单位 L/min。
   哮喘管理里它像一支「血压计」:早上起床后吹一次、晚上睡前吹一次,
   两次的差能反映气道稳不稳。这里把数字存下来,顺手给爱心币。 */

/* 取「今天」的峰流速记录,没有就新建一条。
   日期归属和吃药打卡共用 medDateKey(),所以凌晨补记不会串到第二天 */
function todayPef() {
  const d = medDateKey();
  if (!pefLog[d]) pefLog[d] = { morning: null, evening: null };
  return pefLog[d];
}

/* 把输入框里的文字变成合法数值;不合法就返回 null。
   合法范围 50–900 L/min —— 覆盖儿童到成人,
   也顺手挡住「多按了一个 0」这类手滑。 */
function parsePef(raw) {
  const n = parseInt(String(raw).replace(/[^0-9]/g, ''), 10);
  if (!isFinite(n) || n < 50 || n > 900) return null;
  return n;
}

/* 日内变异率 =(晚 − 早)÷((晚 + 早)÷ 2)× 100%。
   两次都记了才算得出来,否则返回 null。
   临床上常拿 20% 当警戒线:超过说明气道波动偏大。 */
function pefVariability(morning, evening) {
  if (!morning || !evening) return null;
  const avg = (morning + evening) / 2;
  if (avg <= 0) return null;
  return Math.abs(evening - morning) / avg * 100;
}

/* 点「记录」:把两个框里「此刻能记、还没记、填了数字」的都存下来。
   只有正当时段的那一次给爱心币;补记的只存数据、不给币 ——
   数据能补,币不能补。已经记过的可以改数值,但改值也不重复给币。 */
function savePef() {
  const name = PETS[currentPet].name;
  const rec  = todayPef();
  const plan = [
    { slot: 'morning', label: '早上', el: document.getElementById('pefMorning') },
    { slot: 'evening', label: '晚上', el: document.getElementById('pefEvening') }
  ];

  let saved = 0, fixed = 0, paid = 0;
  const late = [], wait = [];

  plan.forEach(function (p) {
    const st  = pefSlotState(p.slot);
    const raw = p.el ? p.el.value : '';
    const val = parsePef(raw);

    /* ① 已经记过的:值没变就不动;值变了就改过来 —— 但不会重复给币 */
    if (rec[p.slot]) {
      if (val !== null && val !== rec[p.slot]) { rec[p.slot] = val; fixed++; }
      return;
    }

    /* ② 还没到点:填了也不收(不然早上就能把晚上的数一起交了) */
    if (st === 'wait') { if (raw !== '') wait.push(p.label); return; }

    /* ③ 空着,或数字不合法:当没填 */
    if (val === null) return;

    /* ④ 收下。正当时段的给币;时段已经过去的只算补记 */
    rec[p.slot] = val;
    saved++;
    if (st === 'now') paid += earnCoins(COIN_EARN.pef);
    else late.push(p.label);
  });

  /* 什么都没发生 —— 说清是哪种情况,别让人对着按钮发愣 */
  if (!saved && !fixed) {
    const canStill = plan.filter(function (p) {
      return !rec[p.slot] && pefSlotState(p.slot) === 'now';
    }).length;
    let why;
    if (wait.length)                        why = wait.join('、') + '还没到记录时间,到时候再填哦~';
    else if (canStill)                      why = '先在框里填一个 50–900 的数字,再点「记录」吧~';
    else if (rec.morning && rec.evening)    why = '今天早晚的峰流速都记好啦~';
    else                                    why = '等到了记录时间再填哦~';
    showMessage(name + ':' + why);
    renderHealth();
    return;
  }

  if (paid) happy = Math.min(100, happy + 3);       // 认真记录,也是在照顾自己
  updateUI();
  happyReaction();
  renderHealth();

  let msg = name + ':' + (saved ? '峰流速记下啦,我帮你存着~' : '峰流速改好啦~');
  if (paid) msg += '(爱心币 +' + paid + ')';
  if (late.length) msg += late.join('、') + '这次算补记,就不给币啦';
  showMessage(msg);
}

/* 把打卡面板刷新成最新状态 */
function renderHealth() {
  const m = todayMed();

  const btnM = document.getElementById('medMorning');
  const btnE = document.getElementById('medEvening');
  const btnS = document.getElementById('signBtn');

  paintMedBtn(btnM, 'morning', m.morning);
  paintMedBtn(btnE, 'evening', m.evening);

  const signed = checkins.indexOf(todayStr()) !== -1;
  btnS.className = 'mini-btn' + (signed ? ' done' : '');
  btnS.innerText = signed ? '今日已签到' : '今日签到';

  /* 「连续签到 X 天 · ♥ 爱心币」这一行由 paintCoins 单独负责,
     因为爱心币不止签到会变,买粮、玩游戏也会 */
  paintCoins();

  /* 峰流速那两个框:能记就白底可填,已记就显示数值并变绿,没到点就灰掉 */
  const rec = todayPef();
  paintPefInput(document.getElementById('pefMorning'), 'morning', rec.morning);
  paintPefInput(document.getElementById('pefEvening'), 'evening', rec.evening);

  /* 峰流速底下那行小字:有两次数就报变异率,否则说清怎么记 */
  const noteP = document.getElementById('pefNote');
  if (noteP) {
    const v = pefVariability(rec.morning, rec.evening);
    if (v === null) {
      noteP.innerHTML = '早晚各吹一次记下来(50–900 L/min),'
                      + '两次都有数就能算出<b>日内变异率</b>';
    } else {
      noteP.innerHTML = '今天:早 <b>' + rec.morning + '</b> / 晚 <b>' + rec.evening
                      + '</b> L/min · 日内变异率 <b>' + v.toFixed(1) + '%</b>'
                      + (v >= 20 ? ' <span class="pef-warn">偏高,记得跟医生说说</span>' : '');
    }
  }

  /* 面板底下那行小字:说清两个时段,以及此刻能打什么 */
  const note = document.getElementById('medNote');
  if (note) {
    const canDo = [], didDo = [];
    ['morning', 'evening'].forEach(function (slot) {
      if (!inMedWindow(slot)) return;                 // 不在时段,不参与提示
      const label = (slot === 'morning' ? '早上' : '晚上');
      if (m[slot]) didDo.push(label); else canDo.push(label);
    });
    note.innerHTML = '打卡时段:<b>' + MED_TIME.morning.label + '</b> / <b>'
                   + MED_TIME.evening.label + '</b><br>'
                   + (canDo.length ? '现在可以打「' + canDo.join('、') + '」的卡'
                    : didDo.length ? '「' + didDo.join('、') + '」的卡已经打过啦'
                                   : '现在不在打卡时段内');
  }
}

/* 画一个打卡按钮。两个按钮的判断完全一样,所以抽出来共用 */
function paintMedBtn(btn, slot, done) {
  const label = (slot === 'morning' ? '早上' : '晚上');
  const open  = inMedWindow(slot);

  if (done) {
    btn.className = 'mini-btn done';
    btn.innerText = label + ' 已吃';
  } else if (open) {
    btn.className = 'mini-btn';
    btn.innerText = label + ' 打卡';
  } else {
    /* 不在时段内:变灰、虚线边,点了会提示 */
    btn.className = 'mini-btn locked';
    btn.innerText = label + ' 未到时间';
  }
}

/* 画一个峰流速输入框。
   有记录了 → 填上数字、变绿、锁住;
   没记录   → 能填就白底等输入,没到点就灰掉并写「未到时间」。
   ★ 注意:不随便清空框里的内容,免得用户正打字时被刷掉 */
function paintPefInput(el, slot, val) {
  if (!el) return;

  if (val) {
    el.value = val;
    /* ★ 故意不禁用:数字打错了得能改回来。
       改数值不会重复给币(savePef 里只对「第一次记下」发币) */
    el.disabled = false;
    el.className = 'pef-input done';
    el.placeholder = '';
    return;
  }

  const wait = pefSlotState(slot) === 'wait';
  el.disabled = wait;
  el.className = 'pef-input';
  el.placeholder = wait ? '未到时间' : 'L/min';
  if (wait) el.value = '';
}

   ============================================================ */
const FOOD_CRUMB = {
  free:   ['#E0BE8A', '#D3AC74', '#EBD2A6'],   // 基础口粮:谷物的米黄
  fish:   ['#AFC0CC', '#93A8B8', '#C8D6DF'],   // 小鱼干:银灰

  beef:   ['#A9563F', '#8E4632', '#C06C52'],   // 牛肉粒:深红棕
  carrot: ['#F0954A', '#DC7F35', '#F7B36E'],   // 胡萝卜条:橙
  grass:  ['#9BBE6B', '#84A855', '#B3D189']    // 提摩西草球:绿

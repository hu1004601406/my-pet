/* 这只宠物对这份食物的偏爱度:3 = 最爱,2 = 爱吃,0 = 不对口。
   不对口就是 0,所以「爱不爱吃」和「爱到什么程度」用一个函数就说明白了 */
function loveOf(food, pet) {
  if (!food || food.like !== pet) return 0;
  return food.love || 2;      // 没写 love 的(比如以后新加的)按「爱吃」算
}

/* 这只宠物最对口的是哪一样?挑食时用来把话说明白:
   「唔…不是我最爱的猫罐头」比「这个不好吃」体贴得多。
   ★ 取的是 love 最高的那一样,不是「第一个对口的」——
     不然 FOODS 里谁排在前面谁就成了「最爱」,加一行新食物就会被顶掉 */
function favoriteFood(pet) {
  let best = null;
  for (let i = 0; i < FOODS.length; i++) {
    if (loveOf(FOODS[i], pet) > loveOf(best, pet)) best = FOODS[i];
  }
  return best;
}

/* 玩一局赚多少币:每 GAME_COIN_PER 分给 1 个,单局封顶、每天再封顶。
   两个上限都在 COIN_EARN 表里,这里不再写死数字 */
const GAME_COIN_PER = 20;

/* 按 id 找一种食物,找不到返回 null */
function findFood(id) {
  for (let i = 0; i < FOODS.length; i++) if (FOODS[i].id === id) return FOODS[i];
  return null;
}

/* ---------- 「连着吃同一种会腻」这本账 ---------- */
/* 这会是连着吃的第几份?只算、不改 —— 真正记账交给 markEaten()。
   中间插了别的东西吃、或者翻了一天,连击就断了,从 1 重新数。
   ★ 免费口粮不参与这本账:它天天都能领、三只宠物都吃,谈不上「连着吃腻了」 */
function eatStreakNext(id) {
  const today = todayStr();
  const prev  = (eatStreak.date === today && eatStreak.id === id) ? eatStreak.n : 0;
  return prev + 1;
}

/* 记一笔「刚咽下这种」。n 由 eatStreakNext() 算好传进来 ——
   在两处各算一遍的话,迟早会算出两个不一样的数 */
function markEaten(id, n) {
  eatStreak = { id: id, n: n, date: todayStr() };
}

/* 连着吃的第几份 → 腻到第几档。第 1 份不腻,第 2 份有点,第 3 份起很腻 */
function boredLevelOf(n) {
  return Math.min(Math.max(1, Math.round(n) || 1) - 1, BORED_FACTOR.length - 1);
}

/* 这份食物喂给当前宠物,实际加多少?
   饱腹 =食物 fill × 偏爱度加成 × 腻度折扣,心情同理。
   streakN 传「这会是连着吃的第几份」(从 1 数);
     不传就按第 1 份算 —— 商店画货架时就是这么用的:显示「下一份能加多少」。
   ★ 这是个纯函数(只算数、不改任何状态),所以可以单独拎出来测 */
function foodEffect(food, pet, streakN) {
  if (!food) {
    return { fill: 0, joy: 0, liked: false, love: 0, streak: 1, bored: 1, boredLevel: 0 };
  }

  const love  = loveOf(food, pet);
  const bonus = LOVE_BONUS[love] || LOVE_BONUS[0];
  const n     = Math.max(1, Math.round(streakN) || 1);
  const lv    = boredLevelOf(n);
  const bored = BORED_FACTOR[lv];

  return {
    fill:  Math.round(food.fill * bonus.fill * bored),
    joy:   Math.round((food.joy + bonus.joy) * bored),
    liked: love > 0,        // 对口 = 走「吃得香」那套吃相
    love:  love,            // 3 最爱 / 2 爱吃 / 0 不对口
    streak: n,              // 连着吃的第几份
    bored: bored,           // 折扣(1 = 不打折)
    boredLevel: lv          // 腻到第几档(0 没腻 / 1 有点 / 2 很腻)
  };
}

/* 今天还能领免费口粮吗?比日期字符串就行 —— 换天自动恢复,不需要定时重置 */
function canFreeFood() {
  return freeFoodDate !== todayStr();
}

/* 加币。所有进账都走这一个口子,以后想加记账、加上限只改这里 */
function earnCoins(n) {
  if (!(n > 0)) return 0;
  coins += n;
  return n;
}

/* 玩游戏赚币:每 GAME_COIN_PER 分 1 币,单局封顶 COIN_EARN.gameRound,
   当天封顶 COIN_EARN.gameDay。
   返回这一局实际赚到多少(到上限了可能只给一部分,甚至 0) */
function gameCoinGain(score) {
  const today = todayStr();
  if (gameCoin.date !== today) gameCoin = { date: today, got: 0 };   // 跨天自动清零
  const want = Math.min(COIN_EARN.gameRound, Math.floor(score / GAME_COIN_PER));
  const left = Math.max(0, COIN_EARN.gameDay - gameCoin.got);
  const got  = Math.min(want, left);
  gameCoin.got += got;
  return got;
}

/* ---------- 买一份,放进粮仓 ---------- */
function buyFood(id) {
  const name = PETS[currentPet].name;
  const food = findFood(id);
  if (!food) return;                          // 表里没有这个 id,直接不理

  if (coins < food.price) {
    showMessage(name + ':爱心币还差 ' + (food.price - coins) + ' 个哦,'
              + '打卡、签到、记峰流速、陪我玩都能赚到~');
    return;
  }

  coins -= food.price;
  bag[id] = (bag[id] || 0) + 1;
  updateUI();                                 // updateUI 里带存档,所以会自动记住
  renderShop();
  showMessage(name + ':' + food.icon + ' ' + food.name + '买好啦,放进粮仓咯!');
}

/* 它吃这一口时要说的话。四种口气,先看腻没腻、再看爱到什么程度:
     腻了      → 嘴上抱怨两句,但还是吃完
     最爱      → 欢呼
     爱吃      → 高兴,顺口提一句「我更爱那样」
     不对口    → 挑食,但客客气气
   ★ 抽成函数是因为 feedFood 里那串三目嵌套已经绕得看不清了,
     搬出来还能单独测「喂小鱼干到底说的是哪一句」 */
function eatLine(food, eff) {
  const fav = favoriteFood(currentPet);

  if (eff.boredLevel > 0) {
    /* 三句都把「腻」字说出来 —— 这个折扣是它自己抱怨出来的,
       用户才知道「怎么加得少了」不是坏了 */
    return pick([
      '唔…又是' + food.name + '呀,有点吃腻了…',
      '又是' + food.name + ',吃腻啦…不过我还是吃完~',
      '换一种好不好嘛,这个我都连着吃腻了~'
    ]);
  }
  if (eff.love === 3) {
    return pick(['这个我最爱吃啦!谢谢你~', '唔!是我最喜欢的味道!', '好吃好吃,还要还要~']);
  }
  if (eff.love === 2) {
    /* 三句都点一次「最爱」的名字 —— 这样「没那么爱」这件事每次都说得清楚,
       而不是三句里只有一句提、看着像随机 */
    return fav
      ? pick(['嗯~' + food.name + '也不错,不过我最爱的还是' + fav.name + '~',
              '好吃!只是我更爱' + fav.name + '~',
              '比' + fav.name + '差一点点,但我也喜欢~'])
      : pick(['嗯~' + food.name + '也不错,谢谢!', '好吃!', '我吃得很开心~']);
  }
  return fav
    ? pick(['唔…不是我最爱的' + fav.name + ',不过我还是吃完啦~',
            '这个…还行吧。下次给我买' + fav.name + '好不好?',
            '不是我的菜,但我慢慢吃完了,谢谢啦~'])
    : pick(['这个…还行吧,谢谢啦~', '我慢慢吃完了~']);
}

/* ---------- 从粮仓里喂掉一份 ---------- */
function feedFood(id) {
  const name = PETS[currentPet].name;
  const food = findFood(id);
  if (!food || !bag[id]) return;              // 粮仓里没有,不理

  settleStatus();                             // 先结账再判断「饱没饱」,理由同 play()

  if (hunger >= 95) { showMessage(name + ':肚子已经饱啦,晚点再喂我吧~'); return; }

  /* ★ 先问「这是连着吃的第几份」,再算效果 ——
     第 2 份起要打 8 折、第 3 份起 6 折,这个折扣就是「吃腻了」。
     顺序不能反:效果算完了才去记账,那这一份就永远按不打折算 */
  const streak = eatStreakNext(food.id);
  const eff    = foodEffect(food, currentPet, streak);

  bag[id] -= 1;
  if (bag[id] <= 0) delete bag[id];           // 吃光了就从粮仓里划掉,免得留个 ×0
  markEaten(food.id, streak);                 // 记一笔,下一份就开始腻了

  hunger = Math.min(100, hunger + eff.fill);
  happy  = Math.min(100, happy  + eff.joy);
  updateUI();

  /* ★ 关键一步:先收起小卖部,再叫它开吃。
     小卖部是铺满整张卡片的不透明浮层(z-index:20)。它要是还开着,
     宠物就在浮层背后吃 —— 动画一秒不差地全演了,可你一眼都看不见。
     所以「喂」这个动作的真正含义是:关上柜台,回主界面看它吃。 */
  closeShop();

  /* 它这一口要说的话,先算好再一起交给 startEating ——
     连喂好几份时,每句话会跟着各自那一口走,轮到谁才说谁。
     台词由 eatLine() 按「腻没腻 + 爱到什么程度」挑 */
  const say = name + ':' + eatLine(food, eff);

  /* ★ 喂什么演什么:对口不对口是两套吃相;最后一个参数把这口的「腻度」也带上,
     状态文字才好写「正在吃东西(有点腻了)」 */
  startEating(food.id, eff.liked, say, eff.boredLevel);
  renderShop();                           // 粮仓少了一份,顺手把柜台刷新好,下次打开就是新的
}

/* ---------- 把整个小卖部画一遍 ---------- */
function renderShop() {
  const grid  = document.getElementById('shopGrid');
  const bagEl = document.getElementById('shopBag');
  if (!grid || !bagEl) return;

  const name = PETS[currentPet].name;

  document.getElementById('shopTitle').innerText = '小卖部 · 给' + name + '买点好吃的';
  document.getElementById('shopCoins').innerText = coins;
  document.getElementById('shopSecFood').innerText =
    '货架 · 标「最爱」的最划算;连着吃同一种会腻,换着来';

  /* 赚币说明:数额全部从 COIN_EARN 表读,改表这里自动跟着变,不会写歪 */
  const tipEl = document.getElementById('shopTip');
  if (tipEl) {
    tipEl.innerText = '爱心币怎么来:吃药打卡 +' + COIN_EARN.med
      + ' · 每日签到 +' + COIN_EARN.sign
      + ' · 记录峰流速 +' + COIN_EARN.pef
      + ' · 陪我玩按分数给(每局最多 ' + COIN_EARN.gameRound
      + ',每天最多 ' + COIN_EARN.gameDay + ')';
  }

  /* 免费口粮那一行:领没领过,文案和灰不灰都跟着变 */
  const freeBtn = document.getElementById('freeFoodBtn');
  const can = canFreeFood();
  freeBtn.className = 'shop-free' + (can ? '' : ' used');
  freeBtn.disabled  = !can;
  document.getElementById('freeFoodT').innerText =
    can ? '免费口粮(每天 1 份)' : '免费口粮 · 今天已经领过了';
  document.getElementById('freeFoodS').innerText =
    can ? '不花钱,饱腹 +15 · 心情 +3' : '明天再来,或者去货架买点好吃的';

  /* 货架:六种食物。按偏爱度排 —— 最爱的排最前,标签也分「最爱」和「爱吃」两档。
     ★ 卡片上的「饱腹 +N / 心情 +N」写的是**下一份会加到的真实值**:
       连着吃了两份的话,这里会自己变成打了 8 折的数,而且多一行小字说明 ——
       腻了这件事,在你掏钱之前就该看得见 */
  const list = FOODS.slice().sort(function (a, b) {
    return loveOf(b, currentPet) - loveOf(a, currentPet);
  });

  grid.innerHTML = list.map(function (f) {
    const eff  = foodEffect(f, currentPet, eatStreakNext(f.id));
    const poor = coins < f.price;            // 钱不够就把按钮真的禁掉
    const tag  = LOVE_NAME[eff.love];        // 不对口时是 undefined,那就没有标签
    const best = eff.love === 3;
    return '<div class="food-card' + (eff.love ? ' liked' : '') + (best ? ' best' : '') + '">'
         +   (tag ? '<span class="food-tag' + (best ? ' best' : '') + '">'
                    + name + tag + '</span>' : '')
         +   '<div class="food-ico">' + f.icon + '</div>'
         +   '<div class="food-name">' + f.name + '</div>'
         +   '<div class="food-eff">饱腹 +' + eff.fill + ' · 心情 +' + eff.joy + '</div>'
         +   (eff.bored < 1
                ? '<div class="food-warn">这是第 ' + eff.streak + ' 份 · 打 '
                  + Math.round(eff.bored * 10) + ' 折</div>'
                : '')
         +   '<button class="food-buy"' + (poor ? ' disabled' : '')
         +     ' onclick="buyFood(\'' + f.id + '\')">♥ ' + f.price + '</button>'
         + '</div>';
  }).join('');

  /* 粮仓:只列买了还没喂的。空的时候说一句人话,别留一片空白 */
  const owned = FOODS.filter(function (f) { return bag[f.id] > 0; });
  if (!owned.length) {
    bagEl.innerHTML = '<div class="bag-empty">粮仓是空的。在上面挑一样买下来,就会出现在这里。</div>';
    return;
  }
  bagEl.innerHTML = owned.map(function (f) {
    const eff = foodEffect(f, currentPet, eatStreakNext(f.id));
    return '<div class="bag-item">'
         +   '<span class="bag-ico">' + f.icon + '</span>'
         +   '<span class="bag-name">' + f.name
         +     '<span class="bag-num">还剩 ' + bag[f.id] + ' 份 · 饱腹 +' + eff.fill
         +     ' · 心情 +' + eff.joy
         +     (eff.bored < 1 ? ' · 吃腻了,打 ' + Math.round(eff.bored * 10) + ' 折' : '')
         +     '</span>'
         +   '</span>'
         +   '<button class="bag-feed" onclick="feedFood(\'' + f.id + '\')">喂</button>'
         + '</div>';
  }).join('');
}

/* ---------- 打开 / 关闭 ---------- */
function openShop() {
  const mask = document.getElementById('shopMask');
  if (!mask) return;

  /* 小游戏浮层要是开着,先关掉 —— 两个浮层叠在一起会分不清谁是谁 */
  const gm = document.getElementById('gameMask');
  if (gm && gm.classList.contains('open')) closeGame();

  /* 它正在嚼、或者两口之间歇着的时候,先别打断。
     因为喂完会自动回主界面,这会儿它嘴边还叼着东西;
     你要是立刻又点「喂食」想看第二份,这一 clearAction 会把好好的一顿掐断,
     嘴一闭食物凭空消失,看着像 bug。等它吃完再进来,这份体贴也不吃亏。
     ★ 歇口气那 4 秒 stageEl 上没有 'eating' 类,得捎上 eatResting 一起判 ——
       不然歇着的时候开一下小卖部,排着的饭就被误清了 */
  if (!stageEl.classList.contains('eating') && !eatResting) clearAction();

  renderShop();
  mask.classList.add('open');
}

function closeShop() {
  const mask = document.getElementById('shopMask');
  if (!mask) return;
  mask.classList.remove('open');
}

  const now = new Date();
  const h = now.getHours();
  const key = todayStr() + '-' + h;
  if (remindedKey === key) return;        // 这个小时已经提醒过了

  const m = todayMed();

}

/* ============================================================
   第 9 步:小游戏「俄罗斯方块」
   ------------------------------------------------------------
   这段代码分成了清清楚楚的两层,这是本步最值得学的地方:

     ① 纯逻辑层(tetro 开头的函数):只跟数组和数字打交道,从不碰画面。
        好处是「改完规则不用真打开网页试」—— 写个测试脚本就能验证。
     ② 画面层(game 开头的函数):读逻辑层算出来的结果,画到 canvas 上。

   为什么不写成一大团? 因为方块游戏最会出错的地方是消行、旋转、
   撞墙、出生位置——这些边界情况全藏在画面背后,肉眼根本看不出来。
   把逻辑剥出来单独放,才能一条一条测。
   ============================================================ */

/* ---------- ① 纯逻辑层 ---------- */

const TETRO_COLS = 10;   // 棋盘 10 列
const TETRO_ROWS = 20;   // 20 行

/* 7 种方块。1 = 有格子,0 = 空。
   只写「一个朝向」就够——其余三个朝向靠旋转算出来 */
const TETRO_SHAPES = {
  I: { color: '#7EC8E3', m: [[1, 1, 1, 1]] },
  J: { color: '#7B9FE0', m: [[1, 0, 0], [1, 1, 1]] },
  L: { color: '#F0A868', m: [[0, 0, 1], [1, 1, 1]] },
  O: { color: '#F5D76E', m: [[1, 1], [1, 1]] },
  S: { color: '#8FD694', m: [[0, 1, 1], [1, 1, 0]] },
  T: { color: '#C79BE0', m: [[0, 1, 0], [1, 1, 1]] },
  Z: { color: '#F0908E', m: [[1, 1, 0], [0, 1, 1]] }
};

/* 空棋盘:20 行 × 10 列,每格先填空字符串(空字符串表示「没有方块」) */
function tetroNewBoard() {
  const b = [];
  for (let r = 0; r < TETRO_ROWS; r++) {
    b.push(new Array(TETRO_COLS).fill(''));
  }
  return b;
}

/* 顺时针转 90°:先转置(行列互换),再把每行左右翻个个儿。
   ★ 一定要返回「新数组」而不是改原来的——原矩阵要留着当基准,
     否则转四次就回不去了 */
function tetroRotate(m) {
  const rows = m.length, cols = m[0].length;
  const out = [];
  for (let r = 0; r < cols; r++) out.push(new Array(rows).fill(0));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      out[c][rows - 1 - r] = m[r][c];
    }
  }
  return out;
}

/* 撞了没有? 方块待在 (px,py) 这个位置合不合法。
   三种情况算撞:探出左右墙、掉出底部、压到已有格子上。
   ★ y < 0 不算撞:方块刚出生时会有一部分在屏幕上方,那是正常的 */
function tetroCollide(board, m, px, py) {
  for (let r = 0; r < m.length; r++) {
    for (let c = 0; c < m[r].length; c++) {
      if (!m[r][c]) continue;
      const x = px + c, y = py + r;
      if (x < 0 || x >= TETRO_COLS) return true;
      if (y >= TETRO_ROWS) return true;
      if (y >= 0 && board[y][x]) return true;
    }
  }
  return false;
}

/* 把方块「烙」进棋盘,返回新棋盘(同样不改原来的) */
function tetroMerge(board, m, px, py, color) {
  const out = board.map(function (row) { return row.slice(); });
  for (let r = 0; r < m.length; r++) {
    for (let c = 0; c < m[r].length; c++) {
      if (!m[r][c]) continue;
      const x = px + c, y = py + r;
      if (y >= 0 && y < TETRO_ROWS && x >= 0 && x < TETRO_COLS) out[y][x] = color;
    }
  }
  return out;
}

/* 消行:整行填满就删掉,上面的整体下移,顶部补上空行。
   返回 { board, lines },lines = 这次消掉几行(0 表示没消) */
function tetroClearLines(board) {
  const keep = board.filter(function (row) {
    return row.some(function (cell) { return !cell; });   // 还有空格的留下
  });
  const lines = TETRO_ROWS - keep.length;
  const fresh = [];
  for (let i = 0; i < lines; i++) fresh.push(new Array(TETRO_COLS).fill(''));
  return { board: fresh.concat(keep), lines: lines };
}

/* 一次消 1/2/3/4 行,分数差得很多——攒满一次消 4 行最划算。
   再乘上等级,等级越高同样的行数给分越多 */
function tetroScoreFor(lines, level) {
  const table = { 1: 100, 2: 300, 3: 500, 4: 800 };
  return (table[lines] || 0) * level;
}

/* 等级越高落得越快,但封底 90 毫秒,再快人就跟不上了 */
function tetroDropMs(level) {
  return Math.max(90, 800 - (level - 1) * 70);
}

/* 7 个一洗:「一袋」里 7 种方块各来一次,打乱顺序挨个发。
   这样就不会出现「连着六个 S」那种让人骂人的运气 */
function tetroBag() {
  const keys = Object.keys(TETRO_SHAPES);
  for (let i = keys.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = keys[i]; keys[i] = keys[j]; keys[j] = t;
  }
  return keys;
}

/* 造一个方块。m 要复制一份,不然旋转时会改到 TETRO_SHAPES 里的原始数据 */
function tetroMakePiece(key) {
  const s = TETRO_SHAPES[key];
  return { key: key, color: s.color, m: s.m.map(function (row) { return row.slice(); }) };
}

/* 新方块出生在水平居中的位置 */
function tetroSpawnX(piece) {
  return Math.floor((TETRO_COLS - piece.m[0].length) / 2);
}

/* 玩得好,心情加得多。但封顶 25 ——
   养成游戏最怕「一个漏洞就能刷满」,封顶就是那道保险 */
function tetroReward(score, lines) {
  const base    = score >= 200 ? 6 : (score >= 50 ? 4 : 2);
  const byScore = Math.min(14, Math.floor(score / 150));   // 每 150 分 +1
  const byLines = Math.min(6, lines);                      // 每消一行 +1
  return Math.min(25, base + byScore + byLines);
}

/* ---------- ② 画面层 ---------- */

const CELL = 24;   // 每格 24 像素 → 棋盘 240 × 480

/* 游戏的全部状态都装在这一个对象里。集中放的好处:
   想知道「游戏现在什么情况」,看这一处就够了 */
const TETRO = {
  board: [],
  cur: null,        // 正在下落的方块
  nextKey: null,    // 下一个方块的种类
  bag: [],          // 还没发的方块口袋
  x: 0, y: 0,       // 正在下落方块的位置(格子坐标,不是像素)
  score: 0,
  lines: 0,
  level: 1,
  running: false,   // 是否在玩
  paused: false,
  settled: false,   // 这一局是否已经结算过奖励(防止重复发奖)
  acc: 0,           // 累计了多久没往下掉一格
  last: 0,          // 上一帧的时间戳
  raf: 0            // 动画帧的编号,退出时要拿它取消
};

function gameCanvas() { return document.getElementById('tetrisCanvas'); }

/* 高清屏适配。手机的 devicePixelRatio 常常是 2 或 3,
   如果画布只用 240×480 个真实像素,看起来就是糊的。
   做法:把画布的真实像素放大 dpr 倍,CSS 尺寸不变,再让绘图坐标整体缩放。 */
function setupCanvas() {
  const cv = gameCanvas();
  if (!cv) return;
  const dpr = (window && window.devicePixelRatio) || 1;
  cv.width  = TETRO_COLS * CELL * dpr;
  cv.height = TETRO_ROWS * CELL * dpr;
  cv.style.width  = (TETRO_COLS * CELL) + 'px';
  cv.style.height = (TETRO_ROWS * CELL) + 'px';
  const ctx = cv.getContext('2d');
  if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* 画一个格子:底色 + 左上角一道白色高光,看起来有点厚度 */
function drawCell(ctx, c, r, color) {
  const x = c * CELL, y = r * CELL;
  ctx.fillStyle = color;
  ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillRect(x + 4, y + 4, CELL - 10, 3);
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 1.5, y + 1.5, CELL - 3, CELL - 3);
}

/* 重画整个画面。顺序:背景 → 网格 → 已落定的格子 → 正在下落的那块 */
function gameDraw() {
  const cv = gameCanvas();
  if (!cv) return;
  const ctx = cv.getContext('2d');
  if (!ctx) return;                    // 有些环境拿不到 2d 上下文,直接不画

  const W = TETRO_COLS * CELL, H = TETRO_ROWS * CELL;

  ctx.fillStyle = '#FFFBF2';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#F5EBDA';
  ctx.lineWidth = 1;
  for (let c = 1; c < TETRO_COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c * CELL + 0.5, 0); ctx.lineTo(c * CELL + 0.5, H); ctx.stroke();
  }
  for (let r = 1; r < TETRO_ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * CELL + 0.5); ctx.lineTo(W, r * CELL + 0.5); ctx.stroke();
  }

  for (let r = 0; r < TETRO_ROWS; r++) {
    for (let c = 0; c < TETRO_COLS; c++) {
      if (TETRO.board[r][c]) drawCell(ctx, c, r, TETRO.board[r][c]);
    }
  }

  if (TETRO.cur && TETRO.running) {
    const m = TETRO.cur.m;
    for (let r = 0; r < m.length; r++) {
      for (let c = 0; c < m[r].length; c++) {
        if (m[r][c] && TETRO.y + r >= 0) {
          drawCell(ctx, TETRO.x + c, TETRO.y + r, TETRO.cur.color);
        }
      }
    }
  }
}

function gameHud() {
  document.getElementById('hudScore').innerText = TETRO.score;
  document.getElementById('hudLines').innerText = TETRO.lines;
  document.getElementById('hudLevel').innerText = TETRO.level;
}

/* 从口袋里拿一个方块。口袋空了就洗新的一袋 */
function gameNextKey() {
  if (!TETRO.bag.length) TETRO.bag = tetroBag();
  return TETRO.bag.shift();
}

/* 出一个新方块。如果一出生就撞上,说明堆到顶了 → 游戏结束 */
function gameSpawn() {
  const piece = tetroMakePiece(TETRO.nextKey || gameNextKey());
  TETRO.nextKey = gameNextKey();
  TETRO.cur = piece;
  TETRO.x = tetroSpawnX(piece);
  TETRO.y = 0;
  if (tetroCollide(TETRO.board, piece.m, TETRO.x, TETRO.y)) {
    TETRO.cur = null;
    gameEnd();
    return false;
  }
  return true;
}

/* 往下掉一格。掉不动了就「落定」 */
function gameStep() {
  if (!TETRO.running || TETRO.paused || !TETRO.cur) return;
  if (!tetroCollide(TETRO.board, TETRO.cur.m, TETRO.x, TETRO.y + 1)) {
    TETRO.y++;
  } else {
    gameLock();
  }
  gameDraw();
}

/* 落定:烙进棋盘 → 检查消行 → 出下一个方块 */
function gameLock() {
  if (!TETRO.cur) return;
  TETRO.board = tetroMerge(TETRO.board, TETRO.cur.m, TETRO.x, TETRO.y, TETRO.cur.color);
  const res = tetroClearLines(TETRO.board);
  TETRO.board = res.board;
  if (res.lines) {
    TETRO.lines += res.lines;
    TETRO.score += tetroScoreFor(res.lines, TETRO.level);
    TETRO.level = Math.floor(TETRO.lines / 10) + 1;   // 每消 10 行升一级
    gameHud();
  }
  gameSpawn();
}

/* 主循环:每帧问一句「距上次下落够久了没」。
   用时间累加而不是 setInterval,是因为等级一变速度,
   setInterval 还得重启,用累加就只要换个阈值 */
function gameLoop(ts) {
  if (!TETRO.running) { TETRO.raf = 0; return; }
  if (!TETRO.last) TETRO.last = ts;
  const dt = ts - TETRO.last;
  TETRO.last = ts;

  if (!TETRO.paused) {
    TETRO.acc += dt;
    const step = tetroDropMs(TETRO.level);
    while (TETRO.acc >= step) {
      TETRO.acc -= step;
      gameStep();
      if (!TETRO.running) break;        // 可能刚好这一步就堆到顶了
    }
  }
  TETRO.raf = requestAnimationFrame(gameLoop);
}

/* 能不能操作? 没在玩、暂停中、或没有方块,都不理 */
function gameAlive() {
  return TETRO.running && !TETRO.paused && !!TETRO.cur;
}

function gameMove(dx) {
  if (!gameAlive()) return;
  if (!tetroCollide(TETRO.board, TETRO.cur.m, TETRO.x + dx, TETRO.y)) {
    TETRO.x += dx;
    gameDraw();
  }
}

/* 旋转。贴墙或贴着别的方块转不动时,试着左右挪一两格再转
   —— 这叫「踢墙」,没有它靠边的地方手感会很别扭 */
function gameRotate() {
  if (!gameAlive()) return;
  const rotated = tetroRotate(TETRO.cur.m);
  const kicks = [0, -1, 1, -2, 2];
  for (let i = 0; i < kicks.length; i++) {
    if (!tetroCollide(TETRO.board, rotated, TETRO.x + kicks[i], TETRO.y)) {
      TETRO.cur.m = rotated;
      TETRO.x += kicks[i];
      gameDraw();
      return;
    }
  }
}

/* 往下压一格(软降),给 1 分辛苦费 */
function gameSoftDrop() {
  if (!gameAlive()) return;
  if (!tetroCollide(TETRO.board, TETRO.cur.m, TETRO.x, TETRO.y + 1)) {
    TETRO.y++;
    TETRO.score += 1;
    gameHud();
  } else {
    gameLock();
  }
  gameDraw();
}

/* 一口气落到底,每格给 2 分 */
function gameHardDrop() {
  if (!gameAlive()) return;
  let cells = 0;
  while (!tetroCollide(TETRO.board, TETRO.cur.m, TETRO.x, TETRO.y + 1)) {
    TETRO.y++; cells++;
  }
  TETRO.score += cells * 2;
  gameLock();
  gameHud();
  gameDraw();
}

function gameTogglePause() {
  if (!TETRO.running) return;
  TETRO.paused = !TETRO.paused;

  const btn = document.getElementById('padPause');
  if (btn) {
    btn.innerText = TETRO.paused ? '继续' : '暂停';
    if (TETRO.paused) btn.classList.add('pause-on');
    else              btn.classList.remove('pause-on');
  }

  gameDraw();
  if (TETRO.paused) {
    const cv = gameCanvas();
    const ctx = cv ? cv.getContext('2d') : null;
    if (ctx) {
      ctx.fillStyle = 'rgba(255,251,242,0.84)';
      ctx.fillRect(0, 0, TETRO_COLS * CELL, TETRO_ROWS * CELL);
      ctx.fillStyle = '#B08968';
      ctx.font = '15px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('已暂停,按 P 或点「继续」', TETRO_COLS * CELL / 2, TETRO_ROWS * CELL / 2);
    }
  }
}

function gameStart() {
  TETRO.board   = tetroNewBoard();
  TETRO.bag     = [];
  TETRO.score   = 0;
  TETRO.lines   = 0;
  TETRO.level   = 1;
  TETRO.paused  = false;
  TETRO.settled = false;
  TETRO.acc     = 0;
  TETRO.last    = 0;
  TETRO.running = true;

  TETRO.nextKey = gameNextKey();
  gameSpawn();

  const btn = document.getElementById('padPause');
  if (btn) { btn.innerText = '暂停'; btn.classList.remove('pause-on'); }

  gameHud();
  gameDraw();
  if (!TETRO.raf) TETRO.raf = requestAnimationFrame(gameLoop);
}

function gameEnd() {
  TETRO.running = false;
  TETRO.cur = null;
  if (TETRO.raf) { cancelAnimationFrame(TETRO.raf); TETRO.raf = 0; }
  gameDraw();
  gameSettle();
}

/* 结算:把分数换成宠物心情。这是「玩游戏」和「养宠物」之间接上的那一根线 */
function gameSettle() {
  if (TETRO.settled) return;            // 一局只发一次奖,防止重复结算把心情刷上去
  const name = PETS[currentPet].name;
  const add  = tetroReward(TETRO.score, TETRO.lines);
  const gotC = gameCoinGain(TETRO.score);   // 分数换爱心币(单局、每天各有上限)

  happy  = Math.min(100, happy  + add);
  hunger = Math.max(0,   hunger - GAME_HUNGER_COST);   // 打一局费 30 饱腹 —— 动脑子最费的其实是体力
  earnCoins(gotC);
  updateUI();                              // updateUI 里带存档,所以会自动记住
  TETRO.settled = true;

  document.getElementById('goScore').innerText  = TETRO.score;
  document.getElementById('goLine').innerText   = '消了 ' + TETRO.lines + ' 行 · 等级 ' + TETRO.level;
  document.getElementById('goReward').innerText = name + '心情 +' + add + ' · 爱心币 +' + gotC
    + ' · 饱腹 -' + GAME_HUNGER_COST
    + (add >= 20 ? ' · 太厉害了!' : add >= 12 ? ' · 玩得不错~' : '');

  let say;
  if (TETRO.score >= 800)      say = '哇!你太厉害了,我在旁边都看呆了~';
  else if (TETRO.score >= 200) say = '好棒!再来一局嘛~';
  else if (TETRO.lines > 0)    say = '消掉' + TETRO.lines + '行了,继续加油!';
  else                         say = '没关系,多练几次就熟啦~';
  showMessage(name + ':' + say);

  document.getElementById('gameOver').classList.add('open');
}

/* ---- 打开 / 关闭 ---- */

function openGame() {
  const mask = document.getElementById('gameMask');
  if (!mask) return;

  /* ★ 开局先结账 + 看嗉子够不够(一局要吃掉 30)。
     不够就干脆别把浮层打开 —— 它会在主界面当场说一声,
     比「进去了才被赶出来」明白得多 */
  if (!enoughHungerToPlay()) return;

  /* 小卖部要是开着,先关掉 —— 两个浮层叠在一起会分不清谁是谁 */
  const sm = document.getElementById('shopMask');
  if (sm && sm.classList.contains('open')) closeShop();

  clearAction();                    // 先把正在跑/跳/睡的动画停掉,别在背后空转
  document.getElementById('gameTitle').innerText =
    '陪' + PETS[currentPet].name + '玩 · 俄罗斯方块';
  document.getElementById('gameOver').classList.remove('open');
  mask.classList.add('open');
  setupCanvas();                    // 浮层显示出来之后再量尺寸
  gameStart();
  showMessage(PETS[currentPet].name + ':一起来玩俄罗斯方块吧!');
}

function closeGame() {
  TETRO.running = false;
  if (TETRO.raf) { cancelAnimationFrame(TETRO.raf); TETRO.raf = 0; }
  document.getElementById('gameMask').classList.remove('open');
  document.getElementById('gameOver').classList.remove('open');
  if (TETRO.settled) happyReaction();   // 刚玩完,让它高兴一下
}

function gameRestart() {
  /* 连打第二局照样要结账、照样看嗉子 —— 上一局刚扣掉 30,很可能已经不够了。
     这时候游戏浮层还开着,气泡会被它盖住,所以话要说在结算面板上 */
  if (!enoughHungerToPlay(document.getElementById('goReward'))) return;
  document.getElementById('gameOver').classList.remove('open');
  gameStart();
}

/* 不想打方块、只想快陪它一下 —— 就是原来那个「玩耍」 */
function quickPlay() {
  closeGame();
  play();
}

/* 键盘。不开游戏时这个函数第一时间就退出了,所以不会影响打字
   —— ★ 「按空格会让整个页面往下滚」,所以识别到按键后要 preventDefault */
function gameKey(e) {
  if (!TETRO.running) return;
  const k = e.key;
  if      (k === 'ArrowLeft')       gameMove(-1);
  else if (k === 'ArrowRight')      gameMove(1);
  else if (k === 'ArrowUp')         gameRotate();
  else if (k === 'ArrowDown')       gameSoftDrop();
  else if (k === ' ')               gameHardDrop();
  else if (k === 'p' || k === 'P')  gameTogglePause();
  else if (k === 'Escape')          { closeGame(); return; }
  else return;
  e.preventDefault();
}

document.addEventListener('keydown', gameKey);

setupCanvas();   // 页面一打开就把画布按屏幕密度设好
</script>
